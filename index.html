<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#08090b">
<title>Автоимперия</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root{
  --bg:#07080a;
  --panel:#101216;
  --panel2:#15171c;
  --panel3:#1b1e24;
  --line:rgba(255,255,255,.08);
  --text:#f5f6f7;
  --muted:#8e939d;
  --red:#e21d32;
  --red2:#ff3048;
  --green:#38d996;
  --gold:#f1c75b;
  --blue:#5c9dff;
  --shadow:0 18px 60px rgba(0,0,0,.45);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",Arial,sans-serif;
}

body{
  overflow-x:hidden;
  padding-bottom:90px;
}

button{
  border:0;
  font:inherit;
  color:inherit;
  cursor:pointer;
}

.app{
  width:100%;
  max-width:620px;
  margin:0 auto;
  min-height:100vh;
  padding:
    calc(12px + env(safe-area-inset-top))
    14px
    calc(95px + env(safe-area-inset-bottom));
}

/* HEADER */

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.brandMark{
  width:38px;
  height:38px;
  border-radius:12px;
  background:linear-gradient(145deg,#24272d,#0d0f12);
  border:1px solid rgba(255,255,255,.09);
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
  font-size:19px;
}

.brandName{
  font-weight:800;
  letter-spacing:.4px;
  font-size:16px;
}

.brandSub{
  color:var(--muted);
  font-size:10px;
  margin-top:2px;
  letter-spacing:1px;
  text-transform:uppercase;
}

.balance{
  text-align:right;
}

.balanceLabel{
  color:var(--muted);
  font-size:9px;
  text-transform:uppercase;
  letter-spacing:1px;
}

.balanceValue{
  font-weight:800;
  font-size:17px;
  margin-top:2px;
}

/* HERO */

.hero{
  position:relative;
  overflow:hidden;
  border-radius:25px;
  min-height:220px;
  padding:22px;
  background:
    radial-gradient(circle at 85% 20%,rgba(226,29,50,.18),transparent 35%),
    linear-gradient(145deg,#181b21,#0e1014 60%,#0a0b0d);
  border:1px solid rgba(255,255,255,.08);
  box-shadow:var(--shadow);
  margin-bottom:18px;
}

.hero:after{
  content:"";
  position:absolute;
  width:240px;
  height:240px;
  right:-100px;
  bottom:-150px;
  background:rgba(226,29,50,.13);
  filter:blur(50px);
  border-radius:50%;
}

.heroTop{
  position:relative;
  z-index:2;
  display:flex;
  justify-content:space-between;
}

.heroEyebrow{
  color:#a7abb3;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:1.8px;
}

.heroTitle{
  font-size:27px;
  font-weight:900;
  letter-spacing:-1px;
  margin-top:5px;
}

.heroText{
  color:#999ea8;
  font-size:12px;
  line-height:1.5;
  margin-top:7px;
  max-width:280px;
}

.heroCar{
  position:absolute;
  right:5px;
  bottom:-12px;
  width:235px;
  height:135px;
  z-index:1;
  transform:perspective(600px) rotateY(-7deg) rotateX(2deg);
}

.carBody{
  position:absolute;
  left:10%;
  bottom:25px;
  width:80%;
  height:42%;
  border-radius:42% 28% 14% 13%;
  background:linear-gradient(145deg,#515761,#15181d 58%,#08090b);
  box-shadow:
    inset -10px -8px 18px rgba(0,0,0,.7),
    inset 8px 7px 15px rgba(255,255,255,.09),
    0 22px 30px rgba(0,0,0,.55);
}

.carRoof{
  position:absolute;
  left:29%;
  bottom:52%;
  width:43%;
  height:32%;
  background:linear-gradient(145deg,#4d535c,#12151a);
  clip-path:polygon(20% 100%,37% 5%,74% 0,100% 100%);
  box-shadow:inset 0 4px 8px rgba(255,255,255,.08);
}

.carWindow{
  position:absolute;
  left:37%;
  bottom:57%;
  width:28%;
  height:20%;
  background:linear-gradient(145deg,#252b32,#050608);
  clip-path:polygon(18% 100%,31% 8%,70% 5%,93% 100%);
  opacity:.95;
}

.carLight{
  position:absolute;
  right:12%;
  bottom:39%;
  width:14%;
  height:8%;
  border-radius:20px;
  background:#dce5ff;
  box-shadow:0 0 13px rgba(190,210,255,.6);
}

.wheel{
  position:absolute;
  bottom:9%;
  width:23%;
  aspect-ratio:1;
  border-radius:50%;
  background:#050607;
  border:7px solid #20242a;
  box-shadow:inset 0 0 0 4px #090a0c;
}

.wheel.left{left:17%}
.wheel.right{right:17%}

.heroBottom{
  position:absolute;
  left:22px;
  bottom:20px;
  z-index:4;
}

.levelBadge{
  display:inline-flex;
  align-items:center;
  gap:7px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.08);
  padding:7px 10px;
  border-radius:10px;
  font-size:10px;
  font-weight:700;
}

.levelDot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--red);
  box-shadow:0 0 10px var(--red);
}

/* SECTION */

.section{
  margin-top:22px;
}

.sectionHead{
  display:flex;
  align-items:end;
  justify-content:space-between;
  margin-bottom:11px;
}

.sectionTitle{
  font-size:18px;
  font-weight:850;
  letter-spacing:-.4px;
}

.sectionSub{
  color:var(--muted);
  font-size:10px;
}

/* CASES */

.cases{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:11px;
}

.case{
  position:relative;
  overflow:hidden;
  min-height:205px;
  padding:15px;
  border-radius:19px;
  background:linear-gradient(145deg,#171a20,#0e1014);
  border:1px solid var(--line);
  box-shadow:0 12px 30px rgba(0,0,0,.24);
  transition:.18s;
}

.case:active{
  transform:scale(.98);
}

.caseTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.rarity{
  font-size:9px;
  text-transform:uppercase;
  letter-spacing:1.3px;
  font-weight:800;
}

.rarity.standard{color:#a8adb5}
.rarity.rare{color:#5ca5ff}
.rarity.legendary{color:#f1c75b}
.rarity.mythic{color:#ff4c65}

.caseName{
  font-size:17px;
  font-weight:850;
  margin-top:5px;
}

.casePrice{
  font-size:12px;
  color:#c9cdd3;
  margin-top:2px;
}

.caseVisual{
  height:82px;
  position:relative;
  margin-top:4px;
}

.miniCar{
  position:absolute;
  left:50%;
  top:48%;
  transform:translate(-50%,-50%) scale(.72);
  width:210px;
  height:120px;
}

.caseBottom{
  position:absolute;
  left:15px;
  right:15px;
  bottom:13px;
}

.caseChance{
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:9px;
  margin-bottom:7px;
}

.openBtn{
  width:100%;
  height:38px;
  border-radius:11px;
  background:#f2f3f4;
  color:#090a0c;
  font-weight:850;
  font-size:11px;
}

.openBtn:active{
  transform:scale(.97);
}

/* GARAGE */

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:11px;
}

.carCard{
  position:relative;
  overflow:hidden;
  background:linear-gradient(145deg,#171a1f,#0d0f12);
  border:1px solid var(--line);
  border-radius:18px;
  padding:12px;
}

.carImage{
  height:115px;
  position:relative;
  margin:-4px -5px 0;
}

.carInfo{
  margin-top:4px;
}

.carName{
  font-size:13px;
  font-weight:800;
}

.carValue{
  color:#9ca1aa;
  font-size:10px;
  margin-top:3px;
}

.sellBtn{
  width:100%;
  height:34px;
  margin-top:10px;
  border-radius:10px;
  background:#24272d;
  color:#e5e7ea;
  font-size:10px;
  font-weight:800;
}

.empty{
  padding:35px 20px;
  text-align:center;
  color:var(--muted);
  background:#101216;
  border:1px solid var(--line);
  border-radius:18px;
  font-size:12px;
}

/* MARKET */

.marketCard{
  display:flex;
  align-items:center;
  gap:13px;
  padding:13px;
  margin-bottom:9px;
  border-radius:17px;
  background:linear-gradient(145deg,#15181d,#0e1013);
  border:1px solid var(--line);
}

.marketImage{
  width:100px;
  height:65px;
  position:relative;
  flex:none;
  transform:scale(.56);
}

.marketInfo{
  flex:1;
}

.marketName{
  font-size:13px;
  font-weight:800;
}

.marketPrice{
  color:#a4a8b0;
  font-size:10px;
  margin-top:4px;
}

.marketBuy{
  background:#f1f2f3;
  color:#08090b;
  padding:9px 11px;
  border-radius:9px;
  font-size:10px;
  font-weight:850;
}

/* PROFILE */

.profile{
  background:linear-gradient(145deg,#15181d,#0d0f12);
  border:1px solid var(--line);
  border-radius:20px;
  padding:18px;
}

.profileTop{
  display:flex;
  align-items:center;
  gap:13px;
}

.avatar{
  width:52px;
  height:52px;
  border-radius:16px;
  background:linear-gradient(145deg,#252932,#0d0f12);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
  border:1px solid rgba(255,255,255,.08);
}

.profileName{
  font-weight:850;
  font-size:16px;
}

.profileLevel{
  color:var(--muted);
  font-size:10px;
  margin-top:3px;
}

.progress{
  margin-top:17px;
}

.progressLine{
  display:flex;
  justify-content:space-between;
  font-size:9px;
  color:var(--muted);
  margin-bottom:6px;
}

.progressBar{
  height:5px;
  border-radius:20px;
  background:#24272c;
  overflow:hidden;
}

.progressFill{
  height:100%;
  background:var(--red);
  border-radius:20px;
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:7px;
  margin-top:14px;
}

.stat{
  padding:12px 7px;
  text-align:center;
  background:#101216;
  border-radius:12px;
  border:1px solid var(--line);
}

.statValue{
  font-size:15px;
  font-weight:850;
}

.statLabel{
  font-size:8px;
  color:var(--muted);
  margin-top:4px;
}

/* NAV */

.nav{
  position:fixed;
  z-index:30;
  left:50%;
  bottom:calc(9px + env(safe-area-inset-bottom));
  transform:translateX(-50%);
  width:min(94%,590px);
  height:67px;
  padding:6px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:4px;
  background:rgba(17,19,23,.94);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.08);
  border-radius:21px;
  box-shadow:0 20px 50px rgba(0,0,0,.55);
}

.navBtn{
  border-radius:15px;
  background:transparent;
  color:#737983;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  font-size:9px;
  font-weight:700;
}

.navIcon{
  font-size:18px;
}

.navBtn.active{
  color:#fff;
  background:#22252b;
}

/* MODAL */

.modal{
  position:fixed;
  z-index:100;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.78);
  backdrop-filter:blur(13px);
}

.modal.show{
  display:flex;
}

.modalBox{
  width:min(100%,520px);
  background:#101216;
  border:1px solid rgba(255,255,255,.1);
  border-radius:25px;
  padding:18px;
  box-shadow:0 30px 100px rgba(0,0,0,.75);
  animation:modalIn .25s ease;
}

@keyframes modalIn{
  from{opacity:0;transform:translateY(20px) scale(.97)}
  to{opacity:1;transform:none}
}

.modalHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:13px;
}

.modalTitle{
  font-weight:900;
  font-size:18px;
}

.close{
  width:34px;
  height:34px;
  border-radius:10px;
  background:#22252a;
  color:#aeb3bb;
  font-size:17px;
}

.roulette{
  position:relative;
  overflow:hidden;
  height:150px;
  border-radius:17px;
  background:#08090b;
  border:1px solid rgba(255,255,255,.08);
}

.rouletteTrack{
  position:absolute;
  left:0;
  top:0;
  height:100%;
  display:flex;
  align-items:center;
  gap:8px;
  padding:12px;
  transform:translateX(0);
  will-change:transform;
}

.marker{
  position:absolute;
  z-index:4;
  top:0;
  bottom:0;
  left:50%;
  width:2px;
  background:var(--red);
  box-shadow:0 0 20px rgba(226,29,50,.8);
}

.marker:before,
.marker:after{
  content:"";
  position:absolute;
  left:50%;
  width:10px;
  height:10px;
  background:var(--red);
  transform:translateX(-50%) rotate(45deg);
}

.marker:before{top:-5px}
.marker:after{bottom:-5px}

.rouletteCard{
  width:112px;
  min-width:112px;
  height:120px;
  border-radius:14px;
  background:linear-gradient(145deg,#191c21,#0d0f12);
  border:1px solid rgba(255,255,255,.07);
  padding:7px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.rouletteImage{
  height:75px;
  position:relative;
}

.rouletteName{
  font-size:9px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.roulettePrice{
  font-size:8px;
  color:#878c95;
}

.result{
  text-align:center;
  padding:15px 0 3px;
  display:none;
}

.result.show{
  display:block;
  animation:resultIn .35s ease;
}

@keyframes resultIn{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:none}
}

.resultLabel{
  color:var(--muted);
  font-size:9px;
  text-transform:uppercase;
  letter-spacing:1.5px;
}

.resultName{
  font-size:22px;
  font-weight:900;
  margin-top:4px;
}

.resultValue{
  color:#d0d3d8;
  font-size:11px;
  margin-top:4px;
}

.resultDiff{
  display:inline-block;
  margin-top:8px;
  padding:6px 9px;
  border-radius:8px;
  font-size:10px;
  font-weight:800;
}

.profit{
  background:rgba(56,217,150,.1);
  color:var(--green);
}

.loss{
  background:rgba(226,29,50,.12);
  color:#ff5367;
}

.neutral{
  background:rgba(255,255,255,.07);
  color:#bbbfc5;
}

/* TOAST */

.toast{
  position:fixed;
  z-index:200;
  left:50%;
  bottom:90px;
  transform:translateX(-50%) translateY(20px);
  opacity:0;
  pointer-events:none;
  background:#f1f2f3;
  color:#090a0c;
  padding:10px 14px;
  border-radius:12px;
  font-size:11px;
  font-weight:800;
  transition:.25s;
  white-space:nowrap;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* RESPONSIVE */

@media(max-width:380px){
  .cases,.grid{
    gap:8px;
  }

  .case{
    min-height:195px;
    padding:12px;
  }

  .hero{
    min-height:210px;
  }

  .heroCar{
    transform:scale(.85);
    transform-origin:right bottom;
    right:-18px;
  }
}
</style>
</head>

<div class="app">

  <header class="header">
    <div class="brand">
      <div class="brandMark">🚘</div>
      <div>
        <div class="brandName">АВТОИМПЕРИЯ</div>
        <div class="brandSub">CAR CASES</div>
      </div>
    </div>

    <div class="balance">

    </div>
  </header>

  <main id="content"></main>

</div>

<nav class="nav">
  <button class="navBtn active" onclick="showPage('cases')" id="navCases">
    <div class="navIcon">🎁</div>
    Кейсы
  </button>

  <button class="navBtn" onclick="showPage('garage')" id="navGarage">
    <div class="navIcon">🚘</div>
    Гараж
  </button>

  <button class="navBtn" onclick="showPage('market')" id="navMarket">
    <div class="navIcon">🛒</div>

  </button>

  <button class="navBtn" onclick="showPage('profile')" id="navProfile">

    Профиль

</nav>

<div class="modal" id="modal">
  <div class="modalBox">

    <div class="modalHead">
      <div class="modalTitle" id="modalTitle">Открытие кейса</div>
      <button class="close" onclick="closeModal()">×</button>
    </div>

    <div class="roulette">
      <div class="marker"></div>
      <div class="rouletteTrack" id="rouletteTrack"></div>
    </div>

    <div class="result" id="result">
      <div class="resultLabel">Твой автомобиль</div>
      <div class="resultName" id="resultName"></div>
      <div class="resultValue" id="resultValue"></div>

  </div>
</div>

<div class="toast" id="toast"></div>

/* =========================
   RANDOM DROP
========================= */

function weightedRandom(items){

  const total = items.reduce((sum,item)=>sum + Number(item[1]),0);

  let r = Math.random() * total;

  for(const item of items){

    r -= Number(item[1]);

    if(r <= 0){
      return item[0];
    }

  }

  return items[items.length-1][0];
}


/* =========================

let audioContext = null;
let spinning = false;

function getAudio(){

  if(!audioContext){
    audioContext =
      new (window.AudioContext || window.webkitAudioContext)();
  }

  return audioContext;
}


/* Новый звук рулетки:
   короткие металлические щелчки
*/

function rouletteTick(){

  try{

    const ctx = getAudio();

    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = "square";

    osc.frequency.setValueAtTime(
      950 + Math.random()*250,
      ctx.currentTime
    );

    gain.gain.setValueAtTime(.0001,ctx.currentTime);

    gain.gain.exponentialRampToValueAtTime(
      .055,
      ctx.currentTime+.005
    );

    gain.gain.exponentialRampToValueAtTime(
      .0001,
      ctx.currentTime+.045
    );

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start();
    osc.stop(ctx.currentTime+.05);

  }catch(e){}

}


function rouletteWinSound(){

  try{

    const ctx = getAudio();

    [523,659,784].forEach((freq,i)=>{

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = "sine";
      osc.frequency.value = freq;

      const start = ctx.currentTime + i*.09;

      gain.gain.setValueAtTime(.0001,start);
      gain.gain.exponentialRampToValueAtTime(.12,start+.03);
      gain.gain.exponentialRampToValueAtTime(.0001,start+.35);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start(start);
      osc.stop(start+.36);

    });

  }catch(e){}

}


function openCase(id){

  if(spinning) return;

  const c = cases.find(x=>x.id===id);

  if(!c) return;

  if(data.balance < c.price){

    toast("Недостаточно средств");

    return;
  }

  try{
    getAudio().resume();
  }catch(e){}

  data.balance -= c.price;
  data.spent += c.price;
  data.opened++;

  save();
  updateBalance();

  spinning = true;

  document.getElementById("modal").classList.add("show");
  document.getElementById("modalTitle").textContent =
    "Открытие · "+c.name;

  document.getElementById("result").classList.remove("show");

  buildRoulette(c);

  setTimeout(()=>{

    const winner = weightedRandom(c.items);

    spinRoulette(c,winner);

  },80);
}


/* =========================
   BUILD ROULETTE
========================= */

function buildRoulette(c){

  const track = document.getElementById("rouletteTrack");

  track.innerHTML = "";

  const list = [];

  for(let i=0;i<36;i++){

    const item =
      c.items[i % c.items.length][0];

    list.push(item);

  }

  list.forEach(name=>{

    const card = document.createElement("div");

    card.className = "rouletteCard";

    card.innerHTML = `

      <div class="rouletteImage">
        ${carVisual(name,true)}
      </div>

      <div>
        <div class="rouletteName">
          ${escapeHTML(name)}
        </div>

        <div class="roulettePrice">
          ${money(getCar(name).price)}
        </div>
      </div>

    `;

    track.appendChild(card);

  });

  track.style.transition = "none";
  track.style.transform = "translateX(0)";
}


/* =========================
   SPIN
========================= */

function spinRoulette(c,winner){

  const track = document.getElementById("rouletteTrack");

  const cards =
    Array.from(track.children);

  const cardWidth = 112 + 8;

  /*
    Победителя ставим примерно
    в центр длинной рулетки.
  */

  const winnerIndex = 27;

  cards[winnerIndex].innerHTML = `

    <div class="rouletteImage">
      ${carVisual(winner,true)}
    </div>

    <div>
      <div class="rouletteName">
        ${escapeHTML(winner)}
      </div>

      <div class="roulettePrice">
        ${money(getCar(winner).price)}
      </div>
    </div>

  `;

  const roulette =
    document.querySelector(".roulette");

  const center =
    roulette.clientWidth / 2;

  const target =
    -(winnerIndex * cardWidth)
    + center
    - 56;

  const duration = 4700;

  let ticks = 0;

  const interval =
    setInterval(()=>{

      rouletteTick();

      ticks++;

      if(ticks > 24){

        clearInterval(interval);

      }

    },150);

  requestAnimationFrame(()=>{

    track.style.transition =
      `transform ${duration}ms cubic-bezier(.08,.72,.14,1)`;

    track.style.transform =
      `translateX(${target}px)`;

  });

  setTimeout(()=>{

    clearInterval(interval);

    finishCase(c,winner);

  },duration+120);

}


/* =========================
   FINISH
========================= */

function finishCase(c,winner){

  const car = getCar(winner);

  data.garage.push({
    name:winner,
    value:car.price,
    time:Date.now()
  });

  data.history.push({
    case:c.name,
    car:winner,
    casePrice:c.price,
    carPrice:car.price,
    time:Date.now()
  });

  save();

  rouletteWinSound();

  const diff =
    car.price - c.price;

  document.getElementById("resultName").textContent =
    winner;

  document.getElementById("resultValue").textContent =
    money(car.price);

  const diffEl =
    document.getElementById("resultDiff");

  if(diff > 0){

    diffEl.textContent =
      "+"+money(diff);

    diffEl.className =
      "resultDiff profit";

  }else if(diff < 0){

    diffEl.textContent =
      "-"+money(Math.abs(diff));

    diffEl.className =
      "resultDiff loss";

  }else{

    diffEl.textContent =
      "В ноль";

    diffEl.className =
      "resultDiff neutral";

  }

  document.getElementById("result")
    .classList.add("show");

  spinning = false;

  updateBalance();

}
