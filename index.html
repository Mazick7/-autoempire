<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#08090c">
<title>Автоимперия</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  background:#08090c;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

body{
  min-height:100vh;
  overflow-x:hidden;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:100%;
  max-width:620px;
  min-height:100vh;
  margin:0 auto;
  padding-bottom:92px;
}

header{
  position:sticky;
  top:0;
  z-index:20;
  padding:15px 16px 14px;
  background:rgba(8,9,12,.88);
  backdrop-filter:blur(22px);
  border-bottom:1px solid rgba(255,255,255,.07);
}

.header-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}

.brand{
  display:flex;
  flex-direction:column;
}

.brand-main{
  font-size:20px;
  font-weight:950;
  letter-spacing:1.2px;
}

.brand-sub{
  margin-top:2px;
  color:#777d8a;
  font-size:9px;
  letter-spacing:3px;
  font-weight:800;
}

.balance-box{
  padding:8px 12px;
  border-radius:13px;
  background:linear-gradient(145deg,#191c24,#101217);
  border:1px solid rgba(255,255,255,.08);
  text-align:right;
}

.balance-label{
  color:#777d88;
  font-size:9px;
  text-transform:uppercase;
  letter-spacing:1px;
}

.balance{
  margin-top:2px;
  font-size:15px;
  font-weight:950;
}

main{
  padding:16px;
}

.hero{
  position:relative;
  overflow:hidden;
  min-height:205px;
  padding:24px;
  margin-bottom:18px;
  border-radius:25px;
  background:
    radial-gradient(circle at 85% 25%,rgba(76,140,255,.22),transparent 30%),
    radial-gradient(circle at 30% 100%,rgba(174,70,255,.12),transparent 35%),
    linear-gradient(145deg,#191d27,#0e1015);
  border:1px solid rgba(255,255,255,.08);
  box-shadow:0 20px 55px rgba(0,0,0,.35);
}

.hero-title{
  position:relative;
  z-index:3;
  font-size:31px;
  line-height:.98;
  font-weight:950;
  letter-spacing:-1.6px;
}

.hero-text{
  position:relative;
  z-index:3;
  margin-top:12px;
  max-width:245px;
  color:#a0a5b0;
  font-size:13px;
  line-height:1.45;
}

.hero-badge{
  position:relative;
  z-index:3;
  display:inline-flex;
  margin-top:17px;
  padding:7px 10px;
  border-radius:10px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.08);
  color:#dfe3ea;
  font-size:9px;
  font-weight:900;
  letter-spacing:1px;
}

.hero-car{
  position:absolute;
  z-index:2;
  right:-2px;
  bottom:20px;
  width:205px;
  height:100px;
  transform:scale(1.05);
}

.car-body{
  position:absolute;
  left:8px;
  bottom:18px;
  width:185px;
  height:46px;
  border-radius:27px 52px 13px 13px;
  background:linear-gradient(145deg,#56606e,#252b35 45%,#101318);
  box-shadow:0 18px 30px rgba(0,0,0,.65);
}

.car-roof{
  position:absolute;
  left:57px;
  bottom:58px;
  width:86px;
  height:38px;
  border-radius:38px 38px 5px 5px;
  background:linear-gradient(145deg,#414a58,#171b21);
  transform:skewX(-18deg);
}

.car-window{
  position:absolute;
  left:68px;
  bottom:62px;
  width:69px;
  height:25px;
  border-radius:18px 18px 3px 3px;
  background:linear-gradient(135deg,#394b61,#090b0f);
  transform:skewX(-18deg);
}

.car-light{
  position:absolute;
  right:12px;
  bottom:39px;
  width:12px;
  height:7px;
  border-radius:50%;
  background:#dff4ff;
  box-shadow:0 0 13px #9ee7ff;
}

.wheel{
  position:absolute;
  bottom:0;
  width:35px;
  height:35px;
  border-radius:50%;
  background:#07080a;
  border:6px solid #303640;
}

.wheel.one{left:32px}
.wheel.two{right:25px}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:22px 2px 12px;
}

.section-title h2{
  margin:0;
  font-size:18px;
  font-weight:950;
}

.section-title span{
  color:#737985;
  font-size:11px;
  font-weight:700;
}

.cases{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.case{
  --case-color:#888;
  position:relative;
  overflow:hidden;
  min-height:205px;
  padding:15px;
  border-radius:21px;
  background:
    radial-gradient(circle at 85% 20%,rgba(255,255,255,.04),transparent 34%),
    linear-gradient(145deg,#191c23,#0f1116);
  border:1px solid rgba(255,255,255,.08);
  box-shadow:0 10px 30px rgba(0,0,0,.28);
  cursor:pointer;
  transition:.18s;
}

.case:active{
  transform:scale(.97);
}

.case-top{
  position:relative;
  z-index:3;
  display:flex;
  justify-content:space-between;
}

.case-rarity{
  padding:5px 8px;
  border-radius:8px;
  background:rgba(255,255,255,.06);
  color:var(--case-color);
  border:1px solid rgba(255,255,255,.08);
  font-size:8px;
  text-transform:uppercase;
  letter-spacing:1px;
  font-weight:900;
}

.case-icon{
  width:34px;
  height:34px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:11px;
  background:rgba(255,255,255,.06);
  font-size:19px;
}

.case-car{
  position:absolute;
  right:4px;
  bottom:42px;
  width:145px;
  height:70px;
  transform:scale(.82);
  transform-origin:right bottom;
  opacity:.92;
}

.case-car .car-body{
  left:0;
  bottom:9px;
  width:135px;
  height:34px;
}

.case-car .car-roof{
  left:40px;
  bottom:41px;
  width:63px;
  height:29px;
}

.case-car .car-window{
  left:49px;
  bottom:44px;
  width:51px;
  height:19px;
}

.case-car .wheel{
  width:27px;
  height:27px;
  border-width:5px;
}

.case-car .wheel.one{left:22px}
.case-car .wheel.two{right:17px}

.case-car .car-light{
  right:5px;
  bottom:29px;
  width:9px;
  height:5px;
}

.case-name{
  position:relative;
  z-index:4;
  margin-top:25px;
  font-size:17px;
  font-weight:950;
}

.case-desc{
  position:relative;
  z-index:4;
  margin-top:5px;
  color:#888e99;
  font-size:10px;
}

.case-price{
  position:absolute;
  z-index:4;
  left:15px;
  bottom:15px;
  font-size:13px;
  font-weight:950;
}

.garage-list,
.market-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.car-card{
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px;
  border-radius:17px;
  background:linear-gradient(145deg,#171a20,#111318);
  border:1px solid rgba(255,255,255,.065);
  box-shadow:0 8px 25px rgba(0,0,0,.2);
}

.car-mini{
  width:75px;
  height:52px;
  flex:0 0 75px;
  position:relative;
  border-radius:13px;
  background:linear-gradient(145deg,#222832,#0d0f12);
  overflow:hidden;
}

.car-mini .body{
  position:absolute;
  left:8px;
  bottom:13px;
  width:58px;
  height:20px;
  border-radius:12px 17px 6px 6px;
  background:linear-gradient(145deg,#596574,#242a32);
}

.car-mini .roof{
  position:absolute;
  left:24px;
  bottom:30px;
  width:29px;
  height:15px;
  border-radius:12px 12px 2px 2px;
  background:linear-gradient(145deg,#475260,#181c22);
}

.car-mini .w{
  position:absolute;
  bottom:7px;
  width:12px;
  height:12px;
  border-radius:50%;
  background:#08090b;
  border:2px solid #343a43;
}

.car-mini .w1{left:17px}
.car-mini .w2{right:12px}

.car-info{
  flex:1;
  min-width:0;
}

.car-name{
  font-size:14px;
  font-weight:900;
}

.car-rarity{
  margin-top:4px;
  font-size:10px;
  font-weight:750;
}

.car-value{
  margin-top:6px;
  font-size:13px;
  font-weight:950;
}

.sell-price{
  margin-top:3px;
  color:#6f7580;
  font-size:9px;
}

.action-btn{
  border:1px solid rgba(255,255,255,.08);
  padding:9px 11px;
  border-radius:11px;
  background:linear-gradient(145deg,#2b3039,#20242b);
  color:#fff;
  font-size:10px;
  font-weight:900;
  white-space:nowrap;
}

.action-btn.green{
  background:linear-gradient(145deg,#214d35,#173425);
  border-color:rgba(95,220,135,.2);
}

.action-btn.red{
  background:linear-gradient(145deg,#4d2529,#32191c);
}

.empty{
  padding:35px 15px;
  text-align:center;
  color:#696e79;
  font-size:13px;
  border:1px dashed rgba(255,255,255,.09);
  border-radius:18px;
}

.market-tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:14px;
}

.market-tab{
  border:1px solid rgba(255,255,255,.07);
  border-radius:13px;
  padding:11px;
  background:#15181e;
  color:#737985;
  font-size:11px;
  font-weight:900;
}

.market-tab.active{
  background:#292e38;
  color:#fff;
}

.market-refresh{
  width:100%;
  margin-bottom:12px;
}

.player-listing{
  padding:15px;
  border-radius:17px;
  background:linear-gradient(145deg,#171a20,#101216);
  border:1px solid rgba(255,255,255,.065);
}

.listing-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
}

.listing-car{
  display:flex;
  align-items:center;
  gap:11px;
}

.listing-name{
  font-size:14px;
  font-weight:950;
}

.listing-seller{
  margin-top:5px;
  color:#777d88;
  font-size:10px;
}

.listing-rarity{
  margin-top:4px;
  font-size:10px;
  font-weight:800;
}

.listing-bottom{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-top:13px;
  padding-top:12px;
  border-top:1px solid rgba(255,255,255,.05);
}

.listing-price{
  font-size:16px;
  font-weight:950;
}

.listing-base{
  margin-top:3px;
  color:#686e78;
  font-size:9px;
}

.profile-card{
  padding:20px;
  border-radius:22px;
  background:linear-gradient(145deg,#191c23,#101217);
  border:1px solid rgba(255,255,255,.07);
  box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.profile-head{
  display:flex;
  align-items:center;
  gap:14px;
}

.avatar{
  width:58px;
  height:58px;
  border-radius:50%;
  overflow:hidden;
  background:linear-gradient(145deg,#313743,#171a20);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  font-weight:900;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profile-name{
  font-size:18px;
  font-weight:950;
}

.profile-level{
  margin-top:4px;
  color:#7b808a;
  font-size:11px;
}

.progress{
  height:7px;
  margin-top:16px;
  border-radius:99px;
  overflow:hidden;
  background:#24272d;
}

.progress-bar{
  height:100%;
  border-radius:99px;
  background:linear-gradient(90deg,#4e8cff,#a768ff);
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:16px;
}

.stat{
  padding:13px;
  border-radius:14px;
  background:rgba(7,8,11,.45);
  border:1px solid rgba(255,255,255,.045);
}

.stat-label{
  color:#686d77;
  font-size:9px;
  text-transform:uppercase;
  letter-spacing:.7px;
}

.stat-value{
  margin-top:5px;
  font-size:15px;
  font-weight:950;
}

.referral-card{
  margin-top:16px;
  padding:16px;
  border-radius:17px;
  background:linear-gradient(145deg,#181c28,#11141b);
  border:1px solid rgba(78,140,255,.15);
}

.referral-title{
  font-size:15px;
  font-weight:950;
}

.referral-text{
  margin-top:5px;
  color:#858b96;
  font-size:10px;
  line-height:1.4;
}

.referral-count{
  margin-top:12px;
  font-size:13px;
  font-weight:900;
}

.referral-link{
  width:100%;
  margin-top:10px;
  padding:11px;
  border-radius:11px;
  border:1px solid rgba(255,255,255,.06);
  background:#090b0f;
  color:#737985;
  font-size:9px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.referral-button{
  width:100%;
  margin-top:9px;
}

.daily-card{
  position:relative;
  overflow:hidden;
  margin-top:18px;
  padding:18px;
  border-radius:21px;
  background:
    radial-gradient(circle at 100% 0%,rgba(255,193,54,.2),transparent 35%),
    linear-gradient(145deg,#211b11,#121318);
  border:1px solid rgba(255,194,64,.22);
}

.daily-title{
  font-size:17px;
  font-weight:950;
}

.daily-sub{
  margin-top:5px;
  color:#99918a;
  font-size:11px;
}

.daily-days{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;
  margin-top:15px;
}

.daily-day{
  min-width:0;
  padding:8px 2px;
  border-radius:10px;
  text-align:center;
  background:#181a1f;
  border:1px solid rgba(255,255,255,.05);
}

.daily-day.active{
  background:linear-gradient(145deg,#f3b83f,#c98220);
  color:#171006;
}

.daily-day.claimed{
  opacity:.48;
}

.daily-day-num{
  font-size:8px;
  font-weight:900;
}

.daily-day-reward{
  margin-top:4px;
  font-size:8px;
  font-weight:900;
}

.daily-button{
  position:relative;
  width:100%;
  margin-top:14px;
  border:0;
  padding:13px;
  border-radius:13px;
  background:linear-gradient(90deg,#ffc84c,#e89a29);
  color:#171006;
  font-size:12px;
  font-weight:950;
}

.daily-button.disabled{
  background:#292c33;
  color:#777c86;
}

.daily-timer{
  margin-top:9px;
  text-align:center;
  color:#8a8f98;
  font-size:9px;
}

.history{
  margin-top:15px;
}

.history-item{
  display:flex;
  justify-content:space-between;
  padding:11px 0;
  border-bottom:1px solid rgba(255,255,255,.05);
  font-size:11px;
}

.history-name{
  font-weight:850;
}

.history-date{
  margin-top:3px;
  color:#666b75;
  font-size:9px;
}

.history-value{
  font-weight:950;
}

.bottom-nav{
  position:fixed;
  left:50%;
  bottom:0;
  z-index:30;
  width:100%;
  max-width:620px;
  transform:translateX(-50%);
  display:grid;
  grid-template-columns:repeat(4,1fr);
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  background:rgba(8,9,12,.94);
  backdrop-filter:blur(20px);
  border-top:1px solid rgba(255,255,255,.07);
}

.nav-btn{
  border:0;
  background:none;
  color:#646974;
  padding:7px 2px;
  font-size:10px;
  font-weight:850;
}

.nav-btn.active{
  color:#fff;
}

.nav-icon{
  display:block;
  margin-bottom:3px;
  font-size:18px;
}

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:flex-end;
  justify-content:center;
  background:rgba(0,0,0,.76);
  backdrop-filter:blur(9px);
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:620px;
  max-height:92vh;
  overflow:auto;
  padding:18px 16px calc(20px + env(safe-area-inset-bottom));
  border-radius:25px 25px 0 0;
  background:#111318;
  border-top:1px solid rgba(255,255,255,.09);
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.modal-title{
  font-size:19px;
  font-weight:950;
}

.close{
  width:34px;
  height:34px;
  border:0;
  border-radius:50%;
  background:#20232a;
  color:#fff;
  font-size:18px;
}

.primary-btn{
  width:100%;
  border:0;
  padding:15px;
  border-radius:15px;
  background:linear-gradient(90deg,#fff,#dfe4eb);
  color:#090a0c;
  font-size:14px;
  font-weight:950;
}

.secondary-btn{
  border:0;
  padding:14px;
  border-radius:14px;
  background:#25282f;
  color:#fff;
  font-size:13px;
  font-weight:850;
}

.case-preview{
  padding:20px 0;
  text-align:center;
}

.big-case{
  width:150px;
  height:105px;
  margin:0 auto;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:23px;
  background:linear-gradient(145deg,#2a3039,#101216);
  box-shadow:0 20px 50px rgba(0,0,0,.5);
  font-size:50px;
}

.preview-name{
  margin-top:15px;
  font-size:21px;
  font-weight:950;
}

.preview-price{
  margin-top:5px;
  color:#7c818b;
  font-size:12px;
}

.roulette-area{
  display:none;
  overflow:hidden;
  margin-top:15px;
}

.roulette-wrap{
  position:relative;
  overflow:hidden;
  border-radius:18px;
  background:#090b0e;
  border:1px solid rgba(255,255,255,.08);
}

.roulette-pointer{
  position:absolute;
  z-index:8;
  top:0;
  left:50%;
  width:3px;
  height:100%;
  transform:translateX(-50%);
  background:#fff;
  box-shadow:0 0 20px #fff;
}

.roulette-track{
  display:flex;
  gap:8px;
  width:max-content;
  padding:15px;
  transform:translateX(0);
  will-change:transform;
}

.roulette-card{
  width:100px;
  height:120px;
  flex:0 0 100px;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  padding:9px;
  border-radius:14px;
  background:linear-gradient(145deg,#1a1d23,#111318);
  border:1px solid rgba(255,255,255,.06);
}

.roulette-car{
  height:68px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.roulette-name{
  font-size:9px;
  line-height:1.2;
  font-weight:850;
}

.roulette-value{
  margin-top:3px;
  color:#777c86;
  font-size:8px;
}

.result{
  display:none;
  padding-top:15px;
  text-align:center;
}

.result-title{
  font-size:12px;
  color:#747984;
  text-transform:uppercase;
  letter-spacing:1.5px;
}

.result-car{
  margin:10px auto;
  width:190px;
  height:105px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:20px;
  background:radial-gradient(circle,#28313d,#101216 70%);
}

.result-name{
  font-size:22px;
  font-weight:950;
}

.result-value{
  margin-top:5px;
  color:#898e98;
  font-size:13px;
}

.result-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:18px;
}

.loading{
  display:none;
  padding:25px;
  text-align:center;
  color:#888d97;
  font-size:13px;
}

.spinner{
  width:25px;
  height:25px;
  margin:0 auto 10px;
  border:3px solid #30343c;
  border-top-color:#fff;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

async function api(path, options = {}){

  const headers = {
    ...(options.headers || {})
  };

  if(options.body){
    headers["Content-Type"] = "application/json";
  }

  if(tg?.initData){
    headers["X-Telegram-Init-Data"] = tg.initData;
  }

  const response = await fetch(
    API_BASE + path,
    {
      ...options,
      headers
    }
  );

  const json = await response
    .json()
    .catch(() => ({}));

  if(!response.ok){
    throw new Error(
      json.error || "Ошибка сервера"
    );
  }

  return json;
}

/* =========================================================
   DAILY
========================================================= */

const DAILY_KEY =
  "autoEmpireDailyLogin";

const dailyRewards = [
  50000,
  75000,
  100000,
  150000,
  250000,
  400000,
  1000000
];

function getDailyData(){

  try{

    return JSON.parse(
      localStorage.getItem(DAILY_KEY)
    ) || {
      streak:0,
      lastClaim:0
    };

  }catch(e){

    return {
      streak:0,
      lastClaim:0
    };

  }

}

function saveDailyData(value){

  localStorage.setItem(
    DAILY_KEY,
    JSON.stringify(value)
  );

}

function startOfDay(timestamp){

  const d =
    new Date(timestamp || 0);

  d.setHours(0,0,0,0);

  return d.getTime();

}

function getDailyState(){

  const daily =
    getDailyData();

  const today =
    startOfDay(Date.now());

  const yesterday =
    today - 86400000;

  const last =
    startOfDay(daily.lastClaim);

  let streak =
    Number(daily.streak || 0);

  if(last === today){

    return {
      claimed:true,
      streak,
      reward:dailyRewards[
        Math.max(
          0,
          Math.min(
            streak - 1,
            dailyRewards.length - 1
          )
        )
      ]
    };

  }

  if(last !== yesterday){
    streak = 0;
  }

  return {
    claimed:false,
    streak,
    reward:dailyRewards[
      Math.min(
        streak,
        dailyRewards.length - 1
      )
    ]
  };

}

function claimDaily(){

  const state =
    getDailyState();

  if(state.claimed){

    toast("Сегодня награда уже получена");

    return;

  }

  /*
    Старый ежедневный бонус сохранён.
    Он не отправляет старые данные обратно
    на сервер и не перезаписывает гараж.
  */

  const old =
    getDailyData();

  const today =
    startOfDay(Date.now());

  const yesterday =
    today - 86400000;

  const oldDay =
    startOfDay(old.lastClaim);

  let streak =
    Number(old.streak || 0);

  if(oldDay === yesterday){
    streak++;
  }else{
    streak = 1;
  }

  if(streak > 7){
    streak = 1;
  }

  const reward =
    dailyRewards[streak - 1];

  data.balance =
    Number(data.balance || 0) + reward;

  saveLocal();

  saveDailyData({
    streak,
    lastClaim:Date.now()
  });

  updateBalance();
  renderCases();

  toast(
    `🎁 Ежедневная награда: +${money(reward)}`
  );

}

function formatTimer(){

  const now =
    new Date();

  const next =
    new Date(now);

  next.setHours(24,0,0,0);

  const diff =
    Math.max(
      0,
      next.getTime() - now.getTime()
    );

  const hours =
    Math.floor(diff / 3600000);

  const minutes =
    Math.floor(
      (diff % 3600000) / 60000
    );

  const seconds =
    Math.floor(
      (diff % 60000) / 1000
    );

  return [
    String(hours).padStart(2,"0"),
    String(minutes).padStart(2,"0"),
    String(seconds).padStart(2,"0")
  ].join(":");

}

/* =========================================================
   AUDIO
========================================================= */

let audioCtx = null;

function initAudio(){

  if(!audioCtx){

    try{

      audioCtx =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }catch(e){}

  }

}

function rouletteTick(progress){

  if(!audioCtx) return;

  try{

    const osc =
      audioCtx.createOscillator();

    const gain =
      audioCtx.createGain();

    osc.type = "square";

    osc.frequency.value =
      760 + progress * 160;

    gain.gain.setValueAtTime(
      .018,
      audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      .001,
      audioCtx.currentTime + .035
    );

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();

    osc.stop(
      audioCtx.currentTime + .04
    );

  }catch(e){}

}

function rouletteWinSound(){

  if(!audioCtx) return;

  const notes = [
    [392,0],
    [494,100],
    [587,200],
    [784,320],
    [988,450]
  ];

  notes.forEach(note=>{

    setTimeout(()=>{

      try{

        const osc =
          audioCtx.createOscillator();

        const gain =
          audioCtx.createGain();

        osc.type = "triangle";
        osc.frequency.value = note[0];

        gain.gain.setValueAtTime(
          .001,
          audioCtx.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
          .10,
          audioCtx.currentTime + .025
        );

        gain.gain.exponentialRampToValueAtTime(
          .001,
          audioCtx.currentTime + .34
        );

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();

        osc.stop(
          audioCtx.currentTime + .36
        );

      }catch(e){}

    },note[1]);

  });

}

/* =========================================================
   ROULETTE
========================================================= */

function buildRoulette(c){

  const track =
    document.getElementById("rouletteTrack");

  let list = [];

  for(let i=0;i<46;i++){

    const item =
      c.items[
        Math.floor(
          Math.random() *
          c.items.length
        )
      ][0];

    list.push(item);

  }

  track.innerHTML =
    list.map(name=>{

      const car =
        getCar(name);

      return `
        <div class="roulette-card">

          <div class="roulette-car">
            ${carVisual()}
          </div>

          <div class="roulette-name">
            ${escapeHTML(name)}
          </div>

          <div class="roulette-value">
            ${money(car.price)}
          </div>

        </div>
      `;

    }).join("");

}

function spinRoulette(c,winner,serverValue){

  const track =
    document.getElementById("rouletteTrack");

  buildRoulette(c);

  const cards =
    track.querySelectorAll(".roulette-card");

  if(cards[35]){

    cards[35].innerHTML = `

      <div class="roulette-car">
        ${carVisual()}
      </div>

      <div class="roulette-name">
        ${escapeHTML(winner)}
      </div>

      <div class="roulette-value">
        ${money(serverValue)}
      </div>
    `;

  }

  const cardWidth = 108;

  const centerOffset =
    window.innerWidth / 2;

  const target =
    -(35 * cardWidth)
    +
    centerOffset
    -
    50
    +
    (Math.random()*20-10);

  track.style.transition = "none";
  track.style.transform = "translateX(0px)";

  requestAnimationFrame(()=>{

    requestAnimationFrame(()=>{

      const start =
        performance.now();

      const duration = 5900;

      let lastTick = -1;

      function frame(now){

        const elapsed =
          now - start;

        const progress =
          Math.min(
            elapsed / duration,
            1
          );

        const eased =
          1 -
          Math.pow(
            1-progress,
            5
          );

        track.style.transform =
          `translateX(${target*eased}px)`;

        const tick =
          Math.floor(progress*50);

        if(tick !== lastTick){

          lastTick = tick;

          rouletteTick(progress);

        }

        if(progress < 1){

          requestAnimationFrame(frame);

        }else{

          finishCase(
            winner,
            serverValue
          );

        }

      }

      requestAnimationFrame(frame);

    });

  });

}

async function copyReferral(){

  const input =
    document.getElementById(
      "referralLink"
    );

  const link =
    input?.dataset?.link || "";

  if(!link){

    toast(
      "Реферальная ссылка пока недоступна"
    );

    return;

  }

  try{

    await navigator.clipboard.writeText(link);

    toast("🔗 Ссылка скопирована");

  }catch(e){

    try{

      input.select();
      document.execCommand("copy");

      toast("🔗 Ссылка скопирована");

    }catch(error){

      toast("Не удалось скопировать ссылку");

    }

  }

}
