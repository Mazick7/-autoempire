<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Автоимперия</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root{
  --bg:#06070b;
  --bg2:#0b0d13;
  --card:#11141c;
  --card2:#161a24;
  --text:#f5f7fb;
  --muted:#858c9d;
  --line:rgba(255,255,255,.08);

  --blue:#4d8dff;
  --cyan:#35d9ff;
  --green:#36df91;
  --purple:#9b65ff;
  --gold:#ffc857;
  --red:#ff4e67;

  --shadow:0 18px 55px rgba(0,0,0,.4);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Segoe UI",
    sans-serif;
}

body{
  overflow-x:hidden;
  padding-bottom:95px;
}

button{
  font:inherit;
  color:inherit;
  border:0;
  outline:0;
  cursor:pointer;
}

button:active{
  transform:scale(.97);
}

.app{
  min-height:100vh;
  background:
    radial-gradient(circle at 10% 0%,rgba(63,112,255,.13),transparent 30%),
    radial-gradient(circle at 90% 10%,rgba(160,75,255,.10),transparent 30%),
    linear-gradient(180deg,#07080d,#05060a);
}

.container{
  width:min(720px,100%);
  margin:auto;
  padding:
    calc(14px + env(safe-area-inset-top))
    14px
    25px;
}

/* =========================
   HEADER
========================= */

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
}

.logoIcon{
  width:43px;
  height:43px;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    linear-gradient(145deg,#5b94ff,#7049e9);
  box-shadow:
    0 8px 25px rgba(75,110,255,.3);
  font-size:21px;
}

.logoText{
  font-size:18px;
  font-weight:900;
  letter-spacing:-.5px;
}

.logoSub{
  font-size:10px;
  color:var(--muted);
  margin-top:2px;
}

.profileMini{
  display:flex;
  align-items:center;
  gap:9px;
  background:rgba(255,255,255,.045);
  border:1px solid var(--line);
  border-radius:16px;
  padding:6px 9px 6px 6px;
}

.avatar{
  width:35px;
  height:35px;
  border-radius:12px;
  background:linear-gradient(145deg,#252b3a,#11151e);
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:16px;
}

.profileMiniName{
  font-size:12px;
  font-weight:800;
  max-width:90px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

/* =========================
   BALANCE
========================= */

.balanceCard{
  position:relative;
  overflow:hidden;
  padding:21px;
  border-radius:25px;
  border:1px solid rgba(255,255,255,.09);
  background:
    radial-gradient(circle at 100% 0%,rgba(72,119,255,.18),transparent 45%),
    linear-gradient(145deg,#111621,#0b0d13);
  box-shadow:var(--shadow);
  margin-bottom:14px;
}

.balanceGlow{
  position:absolute;
  width:170px;
  height:170px;
  right:-70px;
  top:-90px;
  background:#427aff;
  filter:blur(65px);
  opacity:.2;
}

.balanceLabel{
  position:relative;
  color:var(--muted);
  font-size:12px;
  font-weight:700;
}

.balance{
  position:relative;
  font-size:32px;
  line-height:1.05;
  font-weight:950;
  letter-spacing:-1.5px;
  margin:5px 0 15px;
}

.balance span{
  color:#727b8f;
  font-size:18px;
}

.statsRow{
  position:relative;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
}

.statMini{
  background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.06);
  padding:10px;
  border-radius:14px;
}

.statMini b{
  display:block;
  font-size:13px;
}

.statMini span{
  display:block;
  color:var(--muted);
  font-size:9px;
  margin-top:2px;
}

/* =========================
   LEVEL
========================= */

.levelCard{
  background:rgba(255,255,255,.035);
  border:1px solid var(--line);
  border-radius:20px;
  padding:15px;
  margin-bottom:15px;
}

.levelTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:9px;
}

.levelBadge{
  display:flex;
  align-items:center;
  gap:8px;
}

.levelCircle{
  width:35px;
  height:35px;
  border-radius:11px;
  background:linear-gradient(145deg,#4f83ff,#6b4fff);
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:13px;
  font-weight:900;
}

.levelName{
  font-size:12px;
  font-weight:900;
}

.levelNext{
  color:var(--muted);
  font-size:10px;
}

.xpBar{
  height:7px;
  border-radius:100px;
  overflow:hidden;
  background:#1c202a;
}

.xpFill{
  height:100%;
  width:0%;
  border-radius:inherit;
  background:linear-gradient(90deg,#4c83ff,#9c5cff);
  box-shadow:0 0 14px rgba(98,117,255,.5);
  transition:width .4s ease;
}

/* =========================
   SECTION
========================= */

.sectionTitle{
  display:flex;
  align-items:end;
  justify-content:space-between;
  margin:23px 2px 12px;
}

.sectionTitle h2{
  font-size:18px;
  margin:0;
  letter-spacing:-.4px;
}

.sectionTitle span{
  font-size:10px;
  color:var(--muted);
}

/* =========================
   FEATURED CASE
========================= */

.featuredCase{
  position:relative;
  overflow:hidden;
  border-radius:26px;
  min-height:225px;
  padding:21px;
  margin-bottom:16px;
  background:
    radial-gradient(circle at 85% 20%,rgba(255,194,66,.20),transparent 34%),
    linear-gradient(145deg,#18130a,#0d0f14 55%,#12101a);
  border:1px solid rgba(255,200,87,.18);
  box-shadow:0 20px 55px rgba(0,0,0,.42);
}

.featuredCase::after{
  content:"";
  position:absolute;
  width:210px;
  height:210px;
  right:-80px;
  bottom:-90px;
  border-radius:50%;
  background:rgba(255,194,66,.18);
  filter:blur(35px);
}

.featuredTop{
  display:flex;
  justify-content:space-between;
  position:relative;
  z-index:2;
}

.featuredTag{
  padding:6px 9px;
  border-radius:9px;
  background:rgba(255,200,87,.12);
  border:1px solid rgba(255,200,87,.18);
  color:#ffd978;
  font-size:9px;
  font-weight:900;
  text-transform:uppercase;
}

.featuredTimer{
  color:#aab0bd;
  font-size:10px;
}

.featuredTitle{
  position:relative;
  z-index:2;
  font-size:25px;
  font-weight:950;
  margin-top:35px;
  letter-spacing:-1px;
}

.featuredDesc{
  position:relative;
  z-index:2;
  color:#949cab;
  font-size:11px;
  max-width:270px;
  line-height:1.45;
}

.featuredCar{
  position:absolute;
  right:17px;
  bottom:13px;
  width:185px;
  height:110px;
  transform:scale(.85);
}

.featuredButton{
  position:absolute;
  left:21px;
  bottom:19px;
  z-index:4;
  padding:12px 18px;
  border-radius:14px;
  background:linear-gradient(135deg,#ffd86a,#ffac36);
  color:#171008;
  font-weight:950;
  font-size:11px;
  box-shadow:0 10px 25px rgba(255,183,55,.18);
}

/* =========================
   CASES
========================= */

.casesGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:11px;
}

.caseCard{
  position:relative;
  overflow:hidden;
  min-height:235px;
  padding:14px;
  border-radius:22px;
  background:linear-gradient(145deg,#11141c,#0b0d12);
  border:1px solid rgba(255,255,255,.07);
  box-shadow:0 12px 35px rgba(0,0,0,.25);
}

.caseCard:active{
  transform:scale(.98);
}

.caseRarity{
  position:absolute;
  top:11px;
  left:11px;
  padding:5px 7px;
  border-radius:7px;
  font-size:8px;
  font-weight:900;
  background:rgba(255,255,255,.06);
}

.casePrice{
  position:absolute;
  top:11px;
  right:11px;
  font-size:9px;
  font-weight:800;
  color:#c7ccd6;
}

.caseVisual{
  height:116px;
  margin-top:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

.caseVisual::before{
  content:"";
  position:absolute;
  width:100px;
  height:35px;
  bottom:18px;
  border-radius:50%;
  background:rgba(0,0,0,.5);
  filter:blur(10px);
}

.caseArt{
  position:relative;
  width:125px;
  height:75px;
}

.caseBody{
  position:absolute;
  left:10px;
  right:10px;
  bottom:17px;
  height:34px;
  border-radius:12px 22px 8px 8px;
  background:linear-gradient(145deg,#526176,#202632);
  box-shadow:
    inset 0 3px 6px rgba(255,255,255,.13),
    0 8px 15px rgba(0,0,0,.5);
}

.caseRoof{
  position:absolute;
  left:31px;
  top:13px;
  width:64px;
  height:31px;
  border-radius:22px 25px 4px 4px;
  background:linear-gradient(145deg,#46566d,#171c25);
  transform:skew(-8deg);
}

.caseGlass{
  position:absolute;
  left:39px;
  top:18px;
  width:51px;
  height:17px;
  background:linear-gradient(135deg,#78a9d0,#172333);
  clip-path:polygon(0 100%,15% 0,48% 0,100% 100%);
}

.wheel{
  position:absolute;
  width:22px;
  height:22px;
  border-radius:50%;
  bottom:7px;
  background:#050608;
  border:4px solid #262a33;
  box-shadow:inset 0 0 0 3px #101217;
}

.wheel.a{left:22px}
.wheel.b{right:22px}

.caseSport .caseBody{
  background:linear-gradient(145deg,#6b64ff,#181d35);
}

.caseBMW .caseBody{
  background:linear-gradient(145deg,#6e7687,#171b24);
}

.caseSuper .caseBody{
  background:linear-gradient(145deg,#d9ad44,#5e3810);
}

.caseMythic .caseBody{
  background:linear-gradient(145deg,#ff3f56,#671329);
}

.caseName{
  font-weight:950;
  font-size:14px;
  margin-bottom:4px;
}

.caseDesc{
  color:#7f8798;
  font-size:9px;
  line-height:1.35;
  min-height:25px;
}

.caseButton{
  width:100%;
  margin-top:10px;
  padding:10px;
  border-radius:12px;
  font-size:10px;
  font-weight:950;
  background:#1b202a;
  border:1px solid rgba(255,255,255,.07);
}

.caseButton.primary{
  background:linear-gradient(135deg,#4d82ff,#7653ff);
  box-shadow:0 8px 22px rgba(75,105,255,.2);
}

/* =========================
   GARAGE
========================= */

.garageSummary{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:13px;
}

.summaryBox{
  background:linear-gradient(145deg,#11151e,#0c0e14);
  border:1px solid var(--line);
  border-radius:18px;
  padding:14px;
}

.summaryBox span{
  display:block;
  color:var(--muted);
  font-size:9px;
  margin-bottom:4px;
}

.summaryBox b{
  font-size:18px;
}

.filterScroll{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding-bottom:3px;
  margin-bottom:10px;
  scrollbar-width:none;
}

.filterScroll::-webkit-scrollbar{
  display:none;
}

.filterBtn{
  flex:none;
  padding:8px 11px;
  border-radius:10px;
  background:#11141b;
  border:1px solid var(--line);
  color:#9097a7;
  font-size:9px;
  font-weight:850;
}

.filterBtn.active{
  color:white;
  background:#27334c;
  border-color:#496bb0;
}

.sortRow{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.sortSelect{
  background:#11141b;
  color:#cbd0d9;
  border:1px solid var(--line);
  border-radius:10px;
  padding:8px 10px;
  font-size:9px;
}

.garageGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.carCard{
  position:relative;
  background:linear-gradient(145deg,#12151d,#0b0e13);
  border:1px solid rgba(255,255,255,.07);
  border-radius:19px;
  padding:12px;
  overflow:hidden;
}

.carRarityLine{
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:3px;
}

.carThumb{
  height:100px;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
}

.carThumb::after{
  content:"";
  position:absolute;
  width:85px;
  height:18px;
  bottom:12px;
  border-radius:50%;
  background:#000;
  filter:blur(7px);
  opacity:.7;
}

.miniCar{
  position:relative;
  width:115px;
  height:60px;
  z-index:2;
}

.miniBody{
  position:absolute;
  left:7px;
  right:7px;
  bottom:13px;
  height:27px;
  border-radius:9px 18px 7px 7px;
  background:linear-gradient(145deg,#67758c,#1a202b);
  box-shadow:
    inset 0 3px 5px rgba(255,255,255,.12),
    0 7px 12px rgba(0,0,0,.55);
}

.miniRoof{
  position:absolute;
  left:30px;
  top:9px;
  width:58px;
  height:25px;
  border-radius:18px 18px 3px 3px;
  background:linear-gradient(145deg,#53647b,#161b25);
  transform:skew(-7deg);
}

.miniGlass{
  position:absolute;
  left:38px;
  top:13px;
  width:45px;
  height:13px;
  background:linear-gradient(135deg,#85b4d7,#17212e);
  clip-path:polygon(0 100%,15% 0,50% 0,100% 100%);
}

.miniWheel{
  position:absolute;
  width:20px;
  height:20px;
  bottom:4px;
  border-radius:50%;
  background:#050608;
  border:4px solid #292e39;
  z-index:3;
}

.miniWheel.left{left:19px}
.miniWheel.right{right:19px}

.carName{
  font-weight:900;
  font-size:12px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.carMeta{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:7px;
}

.carPrice{
  font-size:10px;
  color:#c5cbd5;
  font-weight:800;
}

.quantity{
  padding:4px 7px;
  border-radius:7px;
  background:#1c2029;
  font-size:8px;
  color:#aeb5c2;
}

.carActions{
  display:grid;
  grid-template-columns:1fr;
  gap:6px;
  margin-top:9px;
}

.smallBtn{
  width:100%;
  padding:8px;
  border-radius:9px;
  background:#191d25;
  color:#c7ccd5;
  font-size:8px;
  font-weight:850;
}

.smallBtn.primary{
  background:#263c67;
  color:#dce7ff;
}

/* =========================
   MARKET
========================= */

.marketInfo{
  padding:14px;
  border-radius:18px;
  background:
    linear-gradient(145deg,rgba(45,75,135,.2),rgba(14,17,24,.8));
  border:1px solid rgba(75,125,255,.12);
  margin-bottom:12px;
}

.marketInfo b{
  font-size:13px;
}

.marketInfo p{
  margin:5px 0 0;
  color:var(--muted);
  font-size:9px;
  line-height:1.45;
}

.marketGrid{
  display:grid;
  gap:8px;
}

.marketItem{
  display:grid;
  grid-template-columns:45px 1fr auto;
  align-items:center;
  gap:10px;
  background:#10131a;
  border:1px solid var(--line);
  border-radius:15px;
  padding:10px;
}

.marketIcon{
  width:43px;
  height:43px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#171c25;
  font-size:19px;
}

.marketName{
  font-size:11px;
  font-weight:900;
}

.marketBase{
  font-size:9px;
  color:#7e8695;
  margin-top:3px;
}

.marketPrice{
  text-align:right;
}

.marketPrice b{
  display:block;
  font-size:11px;
}

.marketChange{
  font-size:8px;
  margin-top:3px;
}

.up{color:#40dc91}
.down{color:#ff6071}

/* =========================
   PROFILE
========================= */

.profileHero{
  text-align:center;
  padding:22px;
  background:
    radial-gradient(circle at 50% 0%,rgba(77,125,255,.2),transparent 45%),
    linear-gradient(145deg,#11151e,#0a0c11);
  border:1px solid var(--line);
  border-radius:24px;
  margin-bottom:12px;
}

.profileAvatar{
  width:72px;
  height:72px;
  border-radius:23px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:auto;
  background:linear-gradient(145deg,#557fff,#764eff);
  box-shadow:0 15px 40px rgba(81,104,255,.3);
  font-size:28px;
}

.profileName{
  font-size:19px;
  font-weight:950;
  margin-top:10px;
}

.profileHandle{
  color:var(--muted);
  font-size:10px;
  margin-top:3px;
}

.profileStats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin-top:16px;
}

.profileStat{
  background:rgba(255,255,255,.04);
  border-radius:12px;
  padding:9px 4px;
}

.profileStat b{
  display:block;
  font-size:12px;
}

.profileStat span{
  display:block;
  color:var(--muted);
  font-size:8px;
  margin-top:2px;
}

.profileSection{
  background:#0e1118;
  border:1px solid var(--line);
  border-radius:19px;
  padding:14px;
  margin-bottom:11px;
}

.profileSectionTitle{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:11px;
}

.profileSectionTitle b{
  font-size:13px;
}

.profileSectionTitle span{
  color:#737b8c;
  font-size:9px;
}

/* =========================
   DAILY
========================= */

.dailyBonus{
  background:
    radial-gradient(circle at 90% 10%,rgba(255,196,76,.18),transparent 35%),
    linear-gradient(145deg,#17130c,#0e1016);
  border:1px solid rgba(255,200,75,.14);
}

.streak{
  display:flex;
  gap:5px;
  margin:10px 0;
}

.day{
  flex:1;
  text-align:center;
  padding:7px 3px;
  border-radius:9px;
  background:#191b20;
  color:#666d7b;
  font-size:8px;
}

.day.done{
  color:#ffd86e;
  background:#332913;
}

.day.current{
  color:white;
  background:#4c3a16;
  border:1px solid #8e6d26;
}

.claimButton{
  width:100%;
  padding:11px;
  border-radius:12px;
  background:linear-gradient(135deg,#ffc94f,#ff9d36);
  color:#171108;
  font-weight:950;
  font-size:10px;
}

.claimButton.disabled{
  opacity:.35;
  pointer-events:none;
}

.quest{
  padding:11px;
  border-radius:14px;
  background:#151821;
  margin-bottom:8px;
}

.quest:last-child{
  margin-bottom:0;
}

.questTop{
  display:flex;
  justify-content:space-between;
  gap:8px;
}

.questTitle{
  font-size:10px;
  font-weight:900;
}

.questReward{
  color:#ffc957;
  font-size:9px;
  font-weight:900;
}

.questDesc{
  color:#747c8d;
  font-size:8px;
  margin-top:3px;
}

.questProgress{
  height:5px;
  border-radius:20px;
  overflow:hidden;
  background:#252a35;
  margin-top:8px;
}

.questFill{
  height:100%;
  background:linear-gradient(90deg,#4d88ff,#8a55ff);
  border-radius:inherit;
}

.questBottom{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:7px;
}

.questCount{
  color:#858d9d;
  font-size:8px;
}

.questClaim{
  padding:6px 8px;
  border-radius:7px;
  background:#26385d;
  color:#cfe0ff;
  font-size:8px;
  font-weight:900;
}

/* =========================
   ACHIEVEMENTS
========================= */

.achievement{
  display:flex;
  gap:10px;
  align-items:center;
  padding:10px;
  background:#151821;
  border-radius:14px;

<script>

/* =========================================================
   TELEGRAM
========================================================= */

const tg =
  window.Telegram &&
  window.Telegram.WebApp
    ? window.Telegram.WebApp
    : null;

if(tg){

  try{

    tg.ready();
    tg.expand();

    tg.setHeaderColor("#070910");
    tg.setBackgroundColor("#070910");

  }catch(e){}

}


/* =========================================================
   SAVE
========================================================= */

const SAVE_KEY = "autoimperiya_save_v4";


const defaultSave = {

  balance:5000000,

  level:1,

  xp:0,

  garage:[],

  casesOpened:0,

  sold:0,

  claimedRewards:[],

  achievements:[],

  daily:{
    date:"",
    quests:[],
    claimed:[],
    bonusClaimed:false,
    streak:0
  },

  mainCar:null,

  prestige:0,

  referrals:0,

  referralClaimed:false,

  lastLogin:"",

  marketSeed:Date.now()

};


let save;


function loadSave(){

  try{

    const raw = localStorage.getItem(SAVE_KEY);

    if(raw){

      const parsed = JSON.parse(raw);

      save = {

        ...defaultSave,
        ...parsed,

        daily:{
          ...defaultSave.daily,
          ...(parsed.daily || {})
        }

      };

    }else{

      save = structuredClone(defaultSave);

    }

  }catch(e){

    save = structuredClone(defaultSave);

  }

  migrateSave();

}


function migrateSave(){

  if(!Array.isArray(save.garage))
    save.garage=[];

  if(!Array.isArray(save.claimedRewards))
    save.claimedRewards=[];

  if(!Array.isArray(save.achievements))
    save.achievements=[];

  if(typeof save.level!=="number")
    save.level=1;

  if(typeof save.xp!=="number")
    save.xp=0;

  if(typeof save.balance!=="number")
    save.balance=5000000;

  if(typeof save.casesOpened!=="number")
    save.casesOpened=0;

  if(typeof save.sold!=="number")
    save.sold=0;

  if(typeof save.prestige!=="number")
    save.prestige=0;

  if(typeof save.referrals!=="number")
    save.referrals=0;

  if(!save.daily || typeof save.daily!=="object"){

    save.daily={
      date:"",
      quests:[],
      claimed:[],
      bonusClaimed:false,
      streak:0
    };

  }

  saveDaily();

  localStorage.setItem(SAVE_KEY,JSON.stringify(save));

}


function persist(){

  localStorage.setItem(
    SAVE_KEY,
    JSON.stringify(save)
  );

}


/* =========================================================
   PLAYER
========================================================= */

const telegramUser =
  tg &&
  tg.initDataUnsafe &&
  tg.initDataUnsafe.user
    ? tg.initDataUnsafe.user
    : null;


function getPlayerName(){

  if(telegramUser){

    return (
      telegramUser.first_name ||
      telegramUser.username ||
      "Игрок"
    );

  }

  return "Игрок";

}


function getPlayerHandle(){

  if(telegramUser && telegramUser.username)
    return "@"+telegramUser.username;

  return "Локальный игрок";

}


/* =========================================================
   XP
========================================================= */

function getXPNeed(level){

  return 100 + ((level-1)*75);

}


const levelRewards={

  2:100000,
  3:300000,
  4:500000,
  5:750000,
  6:1000000,
  7:1500000,
  8:2000000,
  9:2500000,
  10:3000000,
  11:4000000,
  12:5000000,
  13:6000000,
  14:8000000,
  15:10000000,
  16:12000000,
  17:15000000,
  18:20000000,
  19:25000000,
  20:30000000

};


function getLevelReward(level){

  if(levelRewards[level])
    return levelRewards[level];

  let reward=30000000;

  for(let i=21;i<=level;i++)
    reward=Math.floor(reward*1.25);

  return reward;

}


function addXP(amount){

  save.xp+=amount;

  let leveled=false;

  while(save.xp>=getXPNeed(save.level)){

    save.xp-=getXPNeed(save.level);

    save.level++;

    leveled=true;

    const reward=getLevelReward(save.level);

    save.balance+=reward;

    showLevelUp(save.level,reward);

  }

  if(leveled)
    checkAchievements();

  persist();

  updateHeader();

}


/* =========================================================
   CARS
========================================================= */

const rarityNames={

  common:"Обычная",
  uncommon:"Низкая",
  rare:"Редкая",
  epic:"Эпическая",
  legendary:"Легендарная",
  mythic:"Мифическая"

};


const rarityWeights={

  common:42,
  uncommon:27,
  rare:17,
  epic:9,
  legendary:4,
  mythic:1

};


const rarityOrder=[

  "common",
  "uncommon",
  "rare",
  "epic",
  "legendary",
  "mythic"

];


const cars={

"Lada VAZ 2114":{price:180000,rarity:"common",emoji:"🚗"},
"Lada VAZ 2109":{price:160000,rarity:"common",emoji:"🚗"},
"Lada VAZ 2115":{price:190000,rarity:"common",emoji:"🚗"},
"Lada Priora":{price:350000,rarity:"common",emoji:"🚗"},

function todayKey(){

  const d=new Date();

  return [
    d.getFullYear(),
    String(d.getMonth()+1).padStart(2,"0"),
    String(d.getDate()).padStart(2,"0")
  ].join("-");

}


function generateDailyQuests(){

  const shuffled=[...questTemplates]
    .sort(()=>Math.random()-.5);

  return shuffled
    .slice(0,3)
    .map(q=>({
      ...q,
      progress:0
    }));

}


function saveDaily(){

  const today=todayKey();

  if(save.daily.date!==today){

    const previous=save.daily.date;

    if(previous){

      const old=new Date(previous);
      const now=new Date(today);

      const diff=Math.round(
        (now-old)/(1000*60*60*24)
      );

      if(diff===1){

        save.daily.streak=
          Math.min(
            7,
            Number(save.daily.streak||0)+1
          );

      }else{

        save.daily.streak=1;

      }

    }else{

      save.daily.streak=1;

    }

    save.daily.date=today;
    save.daily.quests=generateDailyQuests();
    save.daily.claimed=[];
    save.daily.bonusClaimed=false;

  }

}

function getAchievementProgress(a){

  if(a.type==="uniqueCars")
    return new Set(save.garage).size;

  if(a.type==="rareCars"){

    return save.garage.filter(name=>{

      const r=rarityOrder.indexOf(
        cars[name]?.rarity
      );

      return r>=2;

    }).length;

  }

  if(a.type==="balance")
    return save.balance;

  if(a.type==="mythic"){

    return save.garage.some(
      name=>cars[name]?.rarity==="mythic"
    ) ? 1 : 0;

  }

  if(a.type==="bugatti")
    return save.garage.includes("Bugatti Chiron") ? 1 : 0;

  if(a.type==="cases")
    return save.casesOpened;

  if(a.type==="sold")
    return save.sold;

  if(a.type==="level")
    return save.level;

  return 0;

}


function checkAchievements(){

  achievements.forEach(a=>{

    const progress=getAchievementProgress(a);

    if(
      progress>=a.target &&
      !save.achievements.includes(a.id)
    ){

      save.achievements.push(a.id);

      save.balance+=a.reward;

      showToast(
        `🏆 Достижение «${a.name}» + ${formatMoney(a.reward)} ₽`
      );

    }

  });

  persist();

}

function formatMoney(n){

  return Math.floor(n)
    .toLocaleString("ru-RU");

}


function randomItem(arr){

  return arr[
    Math.floor(
      Math.random()*arr.length
    )
  ];

}


/* =========================================================
   RARITY RANDOM
========================================================= */

function weightedRandom(items){

  const total=items.reduce(
    (sum,name)=>{
      return sum+
        (rarityWeights[cars[name].rarity]||1);
    },
    0
  );

  let r=Math.random()*total;

  for(const name of items){

    r-=rarityWeights[cars[name].rarity]||1;

    if(r<=0)
      return name;

  }

  return items[items.length-1];

}

function marketPrice(name){

  const base=cars[name].price;

  const day=new Date();

  const seed=
    day.getFullYear()*10000+
    (day.getMonth()+1)*100+
    day.getDate()+
    name.length*17;

  const wave=
    Math.sin(seed)*.10+
    Math.sin(seed*.37)*.06;

  return Math.floor(base*(1+wave));

}

function renderDailyQuests(){

  return save.daily.quests.map(q=>{

    let progress=getQuestProgress(q);

    progress=Math.min(progress,q.target);

    const complete=progress>=q.target;

    const claimed=
      save.daily.claimed.includes(q.id);

    return `

      <div class="quest">

        <div class="questTop">

          <div>

            <div class="questTitle">
              ${q.title}
            </div>

              ${q.desc}
            </div>

          </div>

          <div class="questReward">
            +${formatMoney(q.reward)} ₽
          </div>

        </div>

        <div class="questProgress">

          <div
            class="questFill"
            style="
              width:${(progress/q.target)*100}%;
            ">
          </div>

        </div>

        <div class="questBottom">

          <div class="questCount">
            ${formatMoney(progress)} / ${formatMoney(q.target)}
          </div>

          ${
            complete && !claimed
            ?

            `<button
              class="questClaim"
              onclick="claimQuest('${q.id}')">

              ЗАБРАТЬ

            </button>`

            :

            `<div style="
              font-size:8px;
              color:#646c7a;
            ">

              ${
                claimed
                  ? "✓ Получено"
                  : "В процессе"
              }

            </div>`

          }

        </div>

      </div>

    `;

  }).join("");

}


function getQuestProgress(q){

  if(q.type==="cases")
    return save.casesOpened;

  if(q.type==="sold")
    return save.sold;

  if(q.type==="balance")
    return save.balance;

  if(q.type==="rare"){

    return save.garage.some(name=>{

      const rarity=
        rarityOrder.indexOf(
          cars[name]?.rarity
        );

      return rarity>=2;

    }) ? 1 : 0;

  }

  return q.progress||0;

}


function updateQuestProgress(type,amount){

  if(!save.daily.quests)
    return;

  save.daily.quests.forEach(q=>{

    if(q.type===type)
      q.progress=(q.progress||0)+amount;

  });

  persist();

}

========================================================= */

function claimQuest(id){

  const q=
    save.daily.quests.find(x=>x.id===id);

  if(!q)
    return;

  if(save.daily.claimed.includes(id))
    return;

  const progress=getQuestProgress(q);

  if(progress<q.target){

    showToast("Задание ещё не выполнено");
    return;

  }

  save.daily.claimed.push(id);

  save.balance+=q.reward;

  addXP(q.xp);

  persist();

  showToast(
    `📋 Задание выполнено +${formatMoney(q.reward)} ₽`
  );

  render();

}

/* =========================================================
   CREATE ROULETTE
========================================================= */

function createRoulette(c,resultName){

  const track=
    document.getElementById("rouletteTrack");

  track.innerHTML="";

  const items=[];

  for(let i=0;i<35;i++){

    items.push(
      randomItem(c.items)
    );

  }

  /*
    Фиксируем настоящий результат
    именно в центральной позиции.
  */

  items[28]=resultName;

  items.forEach(name=>{

    const car=cars[name];

    const el=
      document.createElement("div");

    el.className="rouletteItem";

    el.innerHTML=`

      <div class="emoji">
        ${car.emoji}
      </div>

      <div class="name">
        ${name}
      </div>

    `;

    track.appendChild(el);

  });

  track.style.transition="none";

  track.style.transform=
    "translateX(0)";

}


/* =========================================================
   ROULETTE ANIMATION
========================================================= */

function animateRoulette(resultName){

  const track=
    document.getElementById("rouletteTrack");

  const index=28;

  const itemWidth=120;

  const gap=8;

  const step=itemWidth+gap;

  const roulette=
    document.getElementById("roulette");

  const center=
    roulette.clientWidth/2;

  const target=
    -(index*step)+
    center-
    itemWidth/2;

  setTimeout(()=>{

    track.style.transition=
      "transform 4.2s cubic-bezier(.08,.7,.12,1)";

    track.style.transform=
      `translateX(${target}px)`;

  },50);

  setTimeout(()=>{

    stopRouletteSound();

    heavySound();

    showResult(resultName);

  },4400);

}

let masterGain=null;
let rouletteInterval=null;


function initAudio(){

  if(audioContext)
    return;

  try{

    audioContext=
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

    masterGain=
      audioContext.createGain();

    masterGain.gain.value=.16;

    masterGain.connect(
      audioContext.destination
    );

  }catch(e){}

}


function beep(
  frequency,
  duration=.08,
  type="sine",
  volume=.15
){

  initAudio();

  if(!audioContext)
    return;

  const osc=
    audioContext.createOscillator();

  const gain=
    audioContext.createGain();

  osc.type=type;

  osc.frequency.value=frequency;

  gain.gain.setValueAtTime(
    0,
    audioContext.currentTime
  );

  gain.gain.linearRampToValueAtTime(
    volume,
    audioContext.currentTime+.005
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audioContext.currentTime+duration
  );

  osc.connect(gain);
  gain.connect(masterGain);

  osc.start();

  osc.stop(
    audioContext.currentTime+duration
  );

}


function clickSound(){

  beep(900,.035,"square",.08);

}


function heavySound(){

  beep(75,.32,"sawtooth",.22);

  setTimeout(
    ()=>beep(48,.45,"sine",.18),
    50
  );

}


function levelUpSound(){

  beep(520,.08,"sine",.12);

  setTimeout(
    ()=>beep(660,.1,"sine",.13),
    90
  );

  setTimeout(
    ()=>beep(880,.18,"sine",.16),
    190
  );

}


function jackpotSound(){

  [440,550,660,880,1100]
    .forEach((f,i)=>{

      setTimeout(
        ()=>beep(f,.15,"sine",.18),
        i*90
      );

    });

}


function startRouletteSound(){

  initAudio();

  if(!audioContext)
    return;

  if(rouletteInterval)
    clearInterval(rouletteInterval);

  let count=0;

  rouletteInterval=
    setInterval(()=>{

      clickSound();

      count++;

      if(count>=52){

        clearInterval(
          rouletteInterval
        );

        rouletteInterval=null;

      }

    },78);

}


function stopRouletteSound(){

  if(rouletteInterval){

    clearInterval(
      rouletteInterval
    );

    rouletteInterval=null;

  }

}

/* =========================================================
   AUDIO UNLOCK ON FIRST TOUCH
========================================================= */

document.addEventListener(
  "touchstart",
  function(){

    initAudio();

    if(
      audioContext &&
      audioContext.state==="suspended"
    ){

      audioContext.resume();

    }

  },
  {once:true}
);


/* =========================================================
   PREVENT DOUBLE TAP ZOOM
========================================================= */

let lastTouch=0;

document.addEventListener(
  "touchend",
  function(e){

    const now=Date.now();

    if(now-lastTouch<=300){

      e.preventDefault();

    }

    lastTouch=now;

  },
  {passive:false}
);

/* =========================================================
   DEMO REFERRAL SUPPORT
========================================================= */

function checkReferralStart(){

  try{

    const params=
      new URLSearchParams(
        window.location.search
      );

    const startParam=
      params.get("tgWebAppStartParam");

    if(
      startParam &&
      startParam.startsWith("ref_") &&
      !localStorage.getItem("ref_processed")
    ){

      localStorage.setItem(
        "ref_processed",
        startParam
      );

      /*
        В этой standalone-версии
        награда локальная.
        Реальную серверную рефералку
        подключим через backend.
      */

      save.balance+=500000;

      save.referrals++;

      persist();

      showToast(
        "👥 Реферальный бонус +500 000 ₽"
      );

    }

  }catch(e){}

}
