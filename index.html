<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b0c0f">
<title>Автоимперия</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  background:#0b0c0f;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

body{
  min-height:100vh;
  overflow-x:hidden;
}

button{
  font:inherit;
}

.app{
  width:100%;
  max-width:620px;
  min-height:100vh;
  margin:0 auto;
  padding-bottom:90px;
}

header{
  position:sticky;
  top:0;
  z-index:20;
  padding:16px 16px 14px;
  background:rgba(11,12,15,.92);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(255,255,255,.06);
}

.header-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}

.brand{
  display:flex;
  flex-direction:column;
}

.brand-main{
  font-size:20px;
  font-weight:900;
  letter-spacing:1.2px;
}

.brand-sub{
  margin-top:2px;
  color:#777b86;
  font-size:9px;
  letter-spacing:3px;
  font-weight:700;
}

.balance-box{
  padding:8px 12px;
  border-radius:12px;
  background:#15171d;
  border:1px solid rgba(255,255,255,.07);
  text-align:right;
}

.balance-label{
  color:#707580;
  font-size:9px;
  text-transform:uppercase;
  letter-spacing:1px;
}

.balance{
  margin-top:2px;
  font-size:15px;
  font-weight:900;
}

main{
  padding:16px;
}

.hero{
  position:relative;
  overflow:hidden;
  min-height:190px;
  padding:24px;
  margin-bottom:18px;
  border-radius:24px;
  background:
    radial-gradient(circle at 90% 20%,rgba(255,255,255,.10),transparent 30%),
    linear-gradient(145deg,#191c23,#101217);
  border:1px solid rgba(255,255,255,.07);
}

.hero:after{
  content:"";
  position:absolute;
  width:220px;
  height:220px;
  right:-90px;
  bottom:-100px;
  border-radius:50%;
  background:rgba(255,255,255,.04);
}

.hero-title{
  position:relative;
  z-index:2;
  font-size:30px;
  line-height:1;
  font-weight:950;
  letter-spacing:-1.5px;
}

.hero-text{
  position:relative;
  z-index:2;
  margin-top:10px;
  max-width:250px;
  color:#8d929d;
  font-size:13px;
  line-height:1.45;
}

.hero-car{
  position:absolute;
  z-index:1;
  right:-5px;
  bottom:20px;
  width:180px;
  height:70px;
}

.car-body{
  position:absolute;
  left:8px;
  bottom:14px;
  width:165px;
  height:42px;
  border-radius:25px 45px 15px 15px;
  background:linear-gradient(145deg,#30343c,#111318);
  box-shadow:0 15px 30px rgba(0,0,0,.55);
}

.car-roof{
  position:absolute;
  left:48px;
  bottom:46px;
  width:76px;
  height:35px;
  border-radius:35px 35px 5px 5px;
  background:#252931;
  transform:skewX(-18deg);
}

.car-window{
  position:absolute;
  left:58px;
  bottom:49px;
  width:61px;
  height:24px;
  border-radius:18px 18px 3px 3px;
  background:linear-gradient(135deg,#242a33,#08090b);
  transform:skewX(-18deg);
}

.wheel{
  position:absolute;
  bottom:0;
  width:32px;
  height:32px;
  border-radius:50%;
  background:#090a0c;
  border:6px solid #24272d;
  box-shadow:inset 0 0 0 4px #0e1014;
}

.wheel.one{left:30px}
.wheel.two{right:24px}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:22px 2px 12px;
}

.section-title h2{
  margin:0;
  font-size:18px;
  font-weight:900;
}

.section-title span{
  color:#696e79;
  font-size:11px;
}

.cases{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.case{
  position:relative;
  overflow:hidden;
  min-height:170px;
  padding:15px;
  border-radius:20px;
  background:linear-gradient(145deg,#17191f,#101216);
  border:1px solid rgba(255,255,255,.06);
  cursor:pointer;
  transition:.15s;
}

.case:active{
  transform:scale(.97);
}

.case-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.case-rarity{
  font-size:9px;
  text-transform:uppercase;
  letter-spacing:1.2px;
  color:#868b96;
}

.case-icon{
  font-size:28px;
}

.case-name{
  margin-top:35px;
  font-size:17px;
  font-weight:900;
}

.case-desc{
  margin-top:5px;
  color:#707580;
  font-size:10px;
}

.case-price{
  margin-top:13px;
  font-size:13px;
  font-weight:900;
}

.case-glow{
  position:absolute;
  right:-35px;
  bottom:-45px;
  width:110px;
  height:110px;
  border-radius:50%;
  background:rgba(255,255,255,.045);
}

.garage-list,
.market-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.car-card{
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px;
  border-radius:17px;
  background:#14161b;
  border:1px solid rgba(255,255,255,.055);
}

.car-mini{
  width:75px;
  height:52px;
  flex:0 0 75px;
  position:relative;
  border-radius:13px;
  background:linear-gradient(145deg,#20242b,#0d0f12);
}

.car-mini .body{
  position:absolute;
  left:8px;
  bottom:13px;
  width:58px;
  height:20px;
  border-radius:12px 17px 6px 6px;
  background:#30343c;
}

.car-mini .roof{
  position:absolute;
  left:24px;
  bottom:30px;
  width:29px;
  height:15px;
  border-radius:12px 12px 2px 2px;
  background:#292d34;
}

.car-mini .w{
  position:absolute;
  bottom:7px;
  width:12px;
  height:12px;
  border-radius:50%;
  background:#090a0c;
  border:2px solid #2b2f36;
}

.car-mini .w1{left:17px}
.car-mini .w2{right:12px}

.car-info{
  flex:1;
  min-width:0;
}

.car-name{
  font-size:14px;
  font-weight:850;
}

.car-rarity{
  margin-top:4px;
  color:#7b808a;
  font-size:10px;
}

.car-value{
  margin-top:6px;
  font-size:13px;
  font-weight:900;
}

.action-btn{
  border:0;
  padding:9px 12px;
  border-radius:11px;
  background:#252930;
  color:#fff;
  font-size:11px;
  font-weight:800;
  cursor:pointer;
}

.action-btn:active{
  transform:scale(.95);
}

.market-price{
  text-align:right;
}

.market-price strong{
  display:block;
  font-size:13px;
}

.market-price button{
  margin-top:7px;
}

.empty{
  padding:35px 15px;
  text-align:center;
  color:#696e79;
  font-size:13px;
  border:1px dashed rgba(255,255,255,.08);
  border-radius:18px;
}

.profile-card{
  padding:20px;
  border-radius:22px;
  background:linear-gradient(145deg,#17191f,#101216);
  border:1px solid rgba(255,255,255,.07);
}

.profile-head{
  display:flex;
  align-items:center;
  gap:14px;
}

.avatar{
  width:58px;
  height:58px;
  border-radius:50%;
  overflow:hidden;
  background:#22252c;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  font-weight:900;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profile-name{
  font-size:18px;
  font-weight:900;
}

.profile-level{
  margin-top:4px;
  color:#7b808a;
  font-size:11px;
}

.progress{
  height:6px;
  margin-top:16px;
  border-radius:99px;
  overflow:hidden;
  background:#24272d;
}

.progress-bar{
  height:100%;
  border-radius:99px;
  background:#fff;
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:16px;
}

.stat{
  padding:13px;
  border-radius:14px;
  background:#121419;
}

.stat-label{
  color:#686d77;
  font-size:9px;
  text-transform:uppercase;
  letter-spacing:.7px;
}

.stat-value{
  margin-top:5px;
  font-size:15px;
  font-weight:900;
}

.history{
  margin-top:15px;
}

.history-item{
  display:flex;
  justify-content:space-between;
  padding:11px 0;
  border-bottom:1px solid rgba(255,255,255,.05);
  font-size:11px;
}

.history-item:last-child{
  border-bottom:0;
}

.history-name{
  font-weight:800;
}

.history-date{
  margin-top:3px;
  color:#666b75;
  font-size:9px;
}

.history-value{
  font-weight:900;
}

.bottom-nav{
  position:fixed;
  left:50%;
  bottom:0;
  z-index:30;
  width:100%;
  max-width:620px;
  transform:translateX(-50%);
  display:grid;
  grid-template-columns:repeat(4,1fr);
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  background:rgba(11,12,15,.94);
  backdrop-filter:blur(18px);
  border-top:1px solid rgba(255,255,255,.06);
}

.nav-btn{
  border:0;
  background:none;
  color:#646974;
  padding:7px 2px;
  font-size:10px;
  font-weight:800;
}

.nav-btn.active{
  color:#fff;
}

.nav-icon{
  display:block;
  margin-bottom:3px;
  font-size:18px;
}

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:flex-end;
  justify-content:center;
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(7px);
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:620px;
  max-height:92vh;
  overflow:auto;
  padding:18px 16px calc(20px + env(safe-area-inset-bottom));
  border-radius:25px 25px 0 0;
  background:#111318;
  border-top:1px solid rgba(255,255,255,.08);
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.modal-title{
  font-size:19px;
  font-weight:900;
}

.close{
  width:34px;
  height:34px;
  border:0;
  border-radius:50%;
  background:#20232a;
  color:#fff;
  font-size:18px;
}

.case-preview{
  padding:20px 0;
  text-align:center;
}

.big-case{
  width:140px;
  height:100px;
  margin:0 auto;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:22px;
  background:linear-gradient(145deg,#252932,#101216);
  box-shadow:0 20px 50px rgba(0,0,0,.45);
  font-size:50px;
}

.preview-name{
  margin-top:15px;
  font-size:21px;
  font-weight:950;
}

.preview-price{
  margin-top:5px;
  color:#7c818b;
  font-size:12px;
}

.primary-btn{
  width:100%;
  border:0;
  padding:15px;
  border-radius:15px;
  background:#fff;
  color:#090a0c;
  font-size:14px;
  font-weight:950;
}

.primary-btn:active{
  transform:scale(.98);
}

.roulette-area{
  display:none;
  overflow:hidden;
  margin-top:15px;
}

.roulette-wrap{
  position:relative;
  overflow:hidden;
  border-radius:17px;
  background:#0b0d10;
  border:1px solid rgba(255,255,255,.07);
}

.roulette-pointer{
  position:absolute;
  z-index:5;
  top:0;
  left:50%;
  width:2px;
  height:100%;
  transform:translateX(-50%);
  background:#fff;
  box-shadow:0 0 15px rgba(255,255,255,.6);
}

.roulette-track{
  display:flex;
  gap:8px;
  width:max-content;
  padding:15px;
  transform:translateX(0);
}

.roulette-card{
  width:100px;
  height:120px;
  flex:0 0 100px;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  padding:9px;
  border-radius:14px;
  background:#171a20;
  border:1px solid rgba(255,255,255,.06);
}

.roulette-car{
  height:68px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.roulette-car .car-mini{
  transform:scale(1.1);
}

.roulette-name{
  font-size:9px;
  line-height:1.2;
  font-weight:800;
}

.roulette-value{
  margin-top:3px;
  color:#777c86;
  font-size:8px;
}

.result{
  display:none;
  padding-top:15px;
  text-align:center;
}

.result-title{
  font-size:12px;
  color:#747984;
  text-transform:uppercase;
  letter-spacing:1.5px;
}

.result-car{
  margin:10px auto;
  width:180px;
  height:100px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:20px;
  background:linear-gradient(145deg,#20242b,#101216);
}

.result-name{
  font-size:22px;
  font-weight:950;
}

.result-value{
  margin-top:5px;
  color:#898e98;
  font-size:13px;
}

.result-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:18px;
}

.secondary-btn{
  border:0;
  padding:14px;
  border-radius:14px;
  background:#25282f;
  color:#fff;
  font-size:13px;
  font-weight:850;
}

.loading{
  display:none;
  padding:25px;
  text-align:center;
  color:#888d97;
  font-size:13px;
}

.spinner{
  width:25px;
  height:25px;
  margin:0 auto 10px;
  border:3px solid #30343c;
  border-top-color:#fff;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.toast{
  position:fixed;
  z-index:200;
  left:50%;
  bottom:90px;
  transform:translateX(-50%) translateY(20px);
  max-width:calc(100% - 30px);
  padding:11px 15px;
  border-radius:13px;
  background:#25282f;
  color:#fff;
  font-size:11px;
  font-weight:700;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  box-shadow:0 10px 30px rgba(0,0,0,.4);
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

@media(max-width:380px){
  .cases{
    gap:9px;
  }

  .case{
    padding:12px;
  }

  .case-name{
    font-size:15px;
  }
}
</style>
</head>

<div class="toast" id="toast"></div>

<script>

const tg = window.Telegram?.WebApp;

if(tg){
  tg.ready();
  tg.expand();

  try{
    tg.setHeaderColor("#0b0c0f");
    tg.setBackgroundColor("#0b0c0f");
  }catch(e){}
}


/* =========================
   SERVER
========================= */

const API_BASE = "https://autoempire-gspr.onrender.com";

let serverReady = false;
let serverUser = null;

async function api(path,options={}){

  const headers = {
    "Content-Type":"application/json",
    ...(options.headers || {})
  };

  if(tg?.initData){
    headers["X-Telegram-Init-Data"] = tg.initData;
  }

  const response = await fetch(
    API_BASE + path,
    {
      ...options,
      headers
    }
  );

  const json = await response.json().catch(()=>({}));

  if(!response.ok){
    throw new Error(json.error || "Ошибка сервера");
  }

  return json;
}


async function loadServer(){

  try{

    const response = await api("/api/auth",{
      method:"POST",
      body:JSON.stringify({
        initData:tg?.initData || ""
      })
    });

    serverReady = true;

    serverUser = response.user || null;

    if(response.data){
      data = response.data;
      saveLocal();
    }

    updateBalance();
    renderCases();

  }catch(error){

    console.error(error);

    serverReady = false;

    toast("Не удалось подключиться к серверу");

  }
}

/* =========================
   AUDIO
========================= */

let audioCtx = null;


function initAudio(){

  if(!audioCtx){

    try{
      audioCtx =
        new (window.AudioContext ||
        window.webkitAudioContext)();
    }catch(e){}

  }

}


function rouletteTick(progress){

  if(!audioCtx) return;

  try{

    const osc =
      audioCtx.createOscillator();

    const gain =
      audioCtx.createGain();

    osc.type = "triangle";

    osc.frequency.value =
      120 + progress * 100;

    gain.gain.setValueAtTime(
      0.035,
      audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      0.001,
      audioCtx.currentTime + 0.045
    );

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + 0.05);

  }catch(e){}

}


function rouletteWinSound(){

  if(!audioCtx) return;

  const notes = [
    392,
    494,
    587,
    784
  ];

  notes.forEach((frequency,index)=>{

    setTimeout(()=>{

      try{

        const osc =
          audioCtx.createOscillator();

        const gain =
          audioCtx.createGain();

        osc.type = "sine";

        osc.frequency.value =
          frequency;

        gain.gain.setValueAtTime(
          0.001,
          audioCtx.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
          0.08,
          audioCtx.currentTime + .02
        );

        gain.gain.exponentialRampToValueAtTime(
          0.001,
          audioCtx.currentTime + .3
        );

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();

        osc.stop(
          audioCtx.currentTime + .32
        );

      }catch(e){}

    },index * 110);

  });

}


/* =========================

async function startCaseOpening(){

  if(spinning) return;

  if(!serverReady){

    toast("Нет соединения с сервером");

    return;
  }

  const c = casesData[currentCase];

  if(!c) return;

  if(data.balance < c.price){

    toast("Недостаточно средств");

    return;
  }

  initAudio();

  try{

    if(audioCtx?.state === "suspended"){
      await audioCtx.resume();
    }

  }catch(e){}

  spinning = true;

  document.getElementById("casePreview")
    .style.display = "none";

  document.getElementById("result")
    .style.display = "none";

  document.getElementById("rouletteArea")
    .style.display = "block";

  document.getElementById("loading")
    .style.display = "block";

  let response;

  try{

    response = await api("/api/cases/open",{

      method:"POST",

      body:JSON.stringify({
        caseId:currentCase
      })

    });

  }catch(error){

    spinning = false;

    document.getElementById("loading")
      .style.display = "none";

    toast(error.message || "Ошибка открытия кейса");

    return;
  }

  document.getElementById("loading")
    .style.display = "none";

  if(response.data){

    data = response.data;

    saveLocal();

    updateBalance();

  }

  const winner =
    response.result?.name;

  const value =
    response.result?.value ||
    getCar(winner).price;

  if(!winner){

    spinning = false;

    toast("Сервер не вернул автомобиль");

    return;
  }

  spinRoulette(
    c,
    winner,
    value
  );

}


/* =========================
   ROULETTE
========================= */

function buildRoulette(c){

  const track =
    document.getElementById("rouletteTrack");

  let list = [];

  for(let i=0;i<46;i++){

    const item =
      c.items[
        Math.floor(
          Math.random() * c.items.length
        )
      ][0];

    list.push(item);

  }

  track.innerHTML = list.map(name=>{

    const car =
      getCar(name);

    return `

      <div class="roulette-card">

        <div class="roulette-car">
          ${carVisual()}
        </div>

        <div class="roulette-name">
          ${escapeHTML(name)}
        </div>

        <div class="roulette-value">
          ${money(car.price)}
        </div>

      </div>
    `;

  }).join("");

}


function spinRoulette(
  c,
  winner,
  serverValue
){

  const track =
    document.getElementById("rouletteTrack");

  buildRoulette(c);

  const cards =
    track.querySelectorAll(".roulette-card");

  if(cards[35]){

    const car =
      getCar(winner);

    cards[35].innerHTML = `

      <div class="roulette-car">
        ${carVisual()}
      </div>

      <div class="roulette-name">
        ${escapeHTML(winner)}
      </div>

      <div class="roulette-value">
        ${money(serverValue)}
      </div>
    `;

  }

  const cardWidth = 108;

  const centerOffset =
    window.innerWidth / 2;

  const target =
    -(35 * cardWidth)
    + centerOffset
    - 50
    + (Math.random() * 20 - 10);

  track.style.transition = "none";

  track.style.transform =
    "translateX(0px)";

  requestAnimationFrame(()=>{

    requestAnimationFrame(()=>{

      const start =
        performance.now();

      const duration = 5200;

      let lastTick = -1;

      function frame(now){

        const elapsed =
          now - start;

        const progress =
          Math.min(elapsed / duration,1);

        const eased =
          1 - Math.pow(1-progress,4);

        const x =
          target * eased;

        track.style.transform =
          `translateX(${x}px)`;

        const tick =
          Math.floor(progress * 38);

        if(tick !== lastTick){

          lastTick = tick;

          rouletteTick(progress);

        }

        if(progress < 1){

          requestAnimationFrame(frame);

        }else{

          finishCase(
            winner,
            serverValue
          );

        }

      }

      requestAnimationFrame(frame);

    });

  });

}

========================= */

function finishCase(

  currentResult = {
