<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0c0f">
<title>Автоимперия</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root{
  --bg:#0b0c0f;
  --panel:#131519;
  --panel2:#181a1f;
  --panel3:#202329;
  --line:rgba(255,255,255,.08);
  --text:#f1f2f4;
  --muted:#9297a1;
  --accent:#e7e9ec;
  --green:#45d39b;
  --red:#ff5368;
  --blue:#69a8ff;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",Arial,sans-serif;
}

body{
  overflow-x:hidden;
  padding-bottom:90px;
}

button{
  border:0;
  font:inherit;
  color:inherit;
  cursor:pointer;
  -webkit-appearance:none;
}

.app{
  width:100%;
  max-width:620px;
  margin:auto;
  min-height:100vh;
  padding:
    calc(12px + env(safe-area-inset-top))
    14px
    calc(95px + env(safe-area-inset-bottom));
}

/* HEADER */

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.brandMark{
  width:36px;
  height:36px;
  border-radius:10px;
  background:#191b20;
  border:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
}

.brandName{
  font-weight:800;
  font-size:15px;
  letter-spacing:.2px;
}

.brandSub{
  color:var(--muted);
  font-size:9px;
  margin-top:2px;
  letter-spacing:1px;
}

.balance{
  text-align:right;
}

.balanceLabel{
  color:var(--muted);
  font-size:9px;
}

.balanceValue{
  font-weight:800;
  font-size:16px;
  margin-top:2px;
}

/* HERO */

.hero{
  position:relative;
  overflow:hidden;
  border-radius:20px;
  min-height:190px;
  padding:20px;
  background:#15171b;
  border:1px solid var(--line);
  margin-bottom:18px;
}

.heroTop{
  position:relative;
  z-index:2;
}

.heroEyebrow{
  color:var(--muted);
  font-size:9px;
  text-transform:uppercase;
  letter-spacing:1.3px;
}

.heroTitle{
  font-size:25px;
  font-weight:850;
  letter-spacing:-.8px;
  margin-top:5px;
}

.heroText{
  color:var(--muted);
  font-size:11px;
  line-height:1.5;
  margin-top:7px;
  max-width:260px;
}

.heroCar{
  position:absolute;
  right:-8px;
  bottom:-8px;
  width:235px;
  height:135px;
  z-index:1;
  transform:perspective(600px) rotateY(-7deg);
}

.heroBottom{
  position:absolute;
  left:20px;
  bottom:18px;
  z-index:4;
}

.levelBadge{
  display:inline-flex;
  align-items:center;
  gap:7px;
  background:#202329;
  border:1px solid var(--line);
  padding:7px 10px;
  border-radius:9px;
  font-size:10px;
  font-weight:700;
}

.levelDot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#aeb3ba;
}

/* CAR */

.carBody{
  position:absolute;
  left:10%;
  bottom:25px;
  width:80%;
  height:42%;
  border-radius:42% 28% 14% 13%;
  background:linear-gradient(145deg,#60656d,#181b20 58%,#090a0c);
  box-shadow:
    inset -10px -8px 18px rgba(0,0,0,.7),
    inset 8px 7px 15px rgba(255,255,255,.08),
    0 18px 25px rgba(0,0,0,.5);
}

.carRoof{
  position:absolute;
  left:29%;
  bottom:52%;
  width:43%;
  height:32%;
  background:linear-gradient(145deg,#555b63,#121519);
  clip-path:polygon(20% 100%,37% 5%,74% 0,100% 100%);
}

.carWindow{
  position:absolute;
  left:37%;
  bottom:57%;
  width:28%;
  height:20%;
  background:linear-gradient(145deg,#2b3036,#050608);
  clip-path:polygon(18% 100%,31% 8%,70% 5%,93% 100%);
}

.carLight{
  position:absolute;
  right:12%;
  bottom:39%;
  width:14%;
  height:8%;
  border-radius:20px;
  background:#dce5ff;
}

.wheel{
  position:absolute;
  bottom:9%;
  width:23%;
  aspect-ratio:1;
  border-radius:50%;
  background:#050607;
  border:7px solid #20242a;
  box-shadow:inset 0 0 0 4px #090a0c;
}

.wheel.left{
  left:17%;
}

.wheel.right{
  right:17%;
}

/* SECTIONS */

.section{
  margin-top:22px;
}

.sectionHead{
  display:flex;
  align-items:end;
  justify-content:space-between;
  margin-bottom:11px;
}

.sectionTitle{
  font-size:18px;
  font-weight:850;
  letter-spacing:-.4px;
}

.sectionSub{
  color:var(--muted);
  font-size:10px;
}

/* CASES */

.cases{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.case{
  position:relative;
  overflow:hidden;
  min-height:202px;
  padding:14px;
  border-radius:17px;
  background:#15171b;
  border:1px solid var(--line);
}

.caseTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.rarity{
  font-size:9px;
  text-transform:uppercase;
  letter-spacing:1px;
  font-weight:800;
}

.rarity.common{
  color:#aeb3bb;
}

.rarity.rare{
  color:#69a8ff;
}

.rarity.epic{
  color:#b88cff;
}

.rarity.legendary{
  color:#f0ad5c;
}

.rarity.mythic{
  color:#ff6275;
}

.caseName{
  font-size:16px;
  font-weight:850;
  margin-top:5px;
}

.casePrice{
  font-size:12px;
  color:#c8ccd2;
  margin-top:2px;
}

.caseVisual{
  height:78px;
  position:relative;
  margin-top:4px;
}

.miniCar{
  position:absolute;
  left:50%;
  top:48%;
  transform:translate(-50%,-50%) scale(.72);
  width:210px;
  height:120px;
}

.caseBottom{
  position:absolute;
  left:14px;
  right:14px;
  bottom:12px;
}

.caseChance{
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:8px;
  margin-bottom:7px;
}

.openBtn{
  width:100%;
  height:37px;
  border-radius:10px;
  background:#e9eaec;
  color:#090a0c;
  font-weight:850;
  font-size:10px;
}

.openBtn:active,
.sellBtn:active,
.keepBtn:active,
.instantSellBtn:active,
.startOpenBtn:active,
.marketBuy:active{
  transform:scale(.97);
}

/* GARAGE */

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.carCard,
.marketCard,
.profile{
  background:#15171b;
  border:1px solid var(--line);
  border-radius:17px;
}

.carCard{
  padding:11px;
  overflow:hidden;
}

.carImage{
  height:110px;
  position:relative;
  margin:-4px -5px 0;
}

.carInfo{
  margin-top:3px;
}

.carName{
  font-size:13px;
  font-weight:800;
}

.carValue{
  color:var(--muted);
  font-size:10px;
  margin-top:3px;
}

.rarityTag{
  display:inline-block;
  margin-top:6px;
  padding:4px 7px;
  border-radius:6px;
  background:#202329;
  font-size:8px;
  color:#aeb3bb;
}

.sellBtn{
  width:100%;
  height:34px;
  margin-top:9px;
  border-radius:9px;
  background:#24272d;
  font-size:10px;
  font-weight:800;
}

.empty{
  padding:35px 20px;
  text-align:center;
  color:var(--muted);
  background:#131519;
  border:1px solid var(--line);
  border-radius:17px;
  font-size:12px;
}

/* MARKET */

.marketCard{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px;
  margin-bottom:9px;
}

.marketImage{
  width:95px;
  height:62px;
  position:relative;
  flex:none;
  transform:scale(.56);
}

.marketInfo{
  flex:1;
}

.marketName{
  font-size:13px;
  font-weight:800;
}

.marketPrice{
  color:var(--muted);
  font-size:10px;
  margin-top:4px;
}

.marketBuy{
  background:#e9eaec;
  color:#08090b;
  padding:9px 11px;
  border-radius:9px;
  font-size:10px;
  font-weight:850;
}

/* PROFILE */

.profile{
  padding:17px;
}

.profileTop{
  display:flex;
  align-items:center;
  gap:13px;
}

.avatar{
  width:50px;
  height:50px;
  border-radius:14px;
  background:#202329;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  overflow:hidden;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profileName{
  font-weight:850;
  font-size:16px;
}

.profileLevel{
  color:var(--muted);
  font-size:10px;
  margin-top:3px;
}

.progress{
  margin-top:16px;
}

.progressLine{
  display:flex;
  justify-content:space-between;
  font-size:9px;
  color:var(--muted);
  margin-bottom:6px;
}

.progressBar{
  height:5px;
  border-radius:20px;
  background:#25282e;
  overflow:hidden;
}

.progressFill{
  height:100%;
  background:#d7d9dc;
  border-radius:20px;
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:7px;
  margin-top:14px;
}

.stat{
  padding:11px 6px;
  text-align:center;
  background:#101216;
  border-radius:10px;
  border:1px solid var(--line);
}

.statValue{
  font-size:14px;
  font-weight:850;
}

.statLabel{
  font-size:8px;
  color:var(--muted);
  margin-top:4px;
}

/* NAV */

.nav{
  position:fixed;
  z-index:30;
  left:50%;
  bottom:calc(9px + env(safe-area-inset-bottom));
  transform:translateX(-50%);
  width:min(94%,590px);
  height:65px;
  padding:6px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:4px;
  background:rgba(19,21,25,.96);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border:1px solid var(--line);
  border-radius:19px;
  box-shadow:0 18px 45px rgba(0,0,0,.5);
}

.navBtn{
  border-radius:13px;
  background:transparent;
  color:#777d87;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  font-size:9px;
  font-weight:700;
}

.navIcon{
  font-size:17px;
}

.navBtn.active{
  color:#fff;
  background:#23262c;
}

/* MODAL */

.modal{
  position:fixed;
  z-index:100;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(0,0,0,.78);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}

.modal.show{
  display:flex;
}

.modalBox{
  width:min(100%,520px);
  max-height:90vh;
  overflow:auto;
  background:#121419;
  border:1px solid var(--line);
  border-radius:22px;
  padding:17px;
  box-shadow:0 30px 90px rgba(0,0,0,.7);
  animation:modalIn .22s ease;
}

@keyframes modalIn{
  from{
    opacity:0;
    transform:translateY(16px) scale(.98);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.modalHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.modalTitle{
  font-weight:900;
  font-size:17px;
}

.close{
  width:33px;
  height:33px;
  border-radius:9px;
  background:#22252b;
  color:#aeb3bb;
  font-size:17px;
}

/* PREVIEW */

.casePreview{
  display:none;
  text-align:center;
}

.casePreview.show{
  display:block;
}

.previewVisual{
  height:145px;
  position:relative;
  margin:3px 0 4px;
}

.previewCar{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%) scale(.95);
  width:240px;
  height:145px;
}

.previewDescription{
  color:var(--muted);
  font-size:11px;
  line-height:1.5;
  margin:0 auto 14px;
  max-width:290px;
}

.previewPrice{
  font-size:11px;
  color:#d1d4d9;
  margin-bottom:12px;
}

.startOpenBtn{
  width:100%;
  height:44px;
  border-radius:11px;
  background:#e9eaec;
  color:#08090b;
  font-size:11px;
  font-weight:900;
}

.cancelOpenBtn{
  width:100%;
  height:38px;
  margin-top:8px;
  border-radius:10px;
  background:#24272d;
  color:#bfc3ca;
  font-size:10px;
  font-weight:800;
}

/* ROULETTE */

.rouletteArea{
  display:none;
}

.rouletteArea.show{
  display:block;
}

.roulette{
  position:relative;
  overflow:hidden;
  height:148px;
  border-radius:15px;
  background:#090a0c;
  border:1px solid var(--line);
}

.rouletteTrack{
  position:absolute;
  left:0;
  top:0;
  height:100%;
  display:flex;
  align-items:center;
  gap:8px;
  padding:12px;
  will-change:transform;
}

.marker{
  position:absolute;
  z-index:4;
  top:0;
  bottom:0;
  left:50%;
  width:2px;
  background:#e4e6e9;
}

.marker:before,
.marker:after{
  content:"";
  position:absolute;
  left:50%;
  width:9px;
  height:9px;
  background:#e4e6e9;
  transform:translateX(-50%) rotate(45deg);
}

.marker:before{
  top:-4px;
}

.marker:after{
  bottom:-4px;
}

.rouletteCard{
  width:112px;
  min-width:112px;
  height:120px;
  border-radius:13px;
  background:#17191e;
  border:1px solid var(--line);
  padding:7px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.rouletteImage{
  height:75px;
  position:relative;
}

.rouletteName{
  font-size:9px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.roulettePrice{
  font-size:8px;
  color:#858b95;
}

.spinHint{
  text-align:center;
  color:var(--muted);
  font-size:9px;
  margin-top:9px;
}

/* RESULT */

.result{
  text-align:center;
  padding:15px 0 3px;
  display:none;
}

.result.show{
  display:block;
  animation:resultIn .3s ease;
}

@keyframes resultIn{
  from{
    opacity:0;
    transform:translateY(7px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.resultLabel{
  color:var(--muted);
  font-size:9px;
  text-transform:uppercase;
  letter-spacing:1.3px;
}

.resultName{
  font-size:21px;
  font-weight:900;
  margin-top:4px;
}

.resultValue{
  color:#d0d3d8;
  font-size:11px;
  margin-top:4px;
}

.resultDiff{
  display:inline-block;
  margin-top:7px;
  padding:6px 9px;
  border-radius:7px;
  font-size:10px;
  font-weight:800;
}

.profit{
  background:rgba(69,211,155,.1);
  color:var(--green);
}

.loss{
  background:rgba(255,83,104,.1);
  color:var(--red);
}

.neutral{
  background:#202329;
  color:#b8bdc5;
}

.resultActions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:12px;
}

.keepBtn,
.instantSellBtn{
  height:40px;
  border-radius:10px;
  font-size:10px;
  font-weight:850;
}

.keepBtn{
  background:#25282e;
}

.instantSellBtn{
  background:#e9eaec;
  color:#08090b;
}

.sellInfo{
  font-size:9px;
  color:var(--muted);
  margin-top:8px;
}

/* LOADING */

.loading{
  text-align:center;
  padding:18px;
  color:var(--muted);
  font-size:10px;
}

.loader{
  width:24px;
  height:24px;
  margin:0 auto 10px;
  border-radius:50%;
  border:2px solid #292c32;
  border-top-color:#e7e9ec;
  animation:loader .7s linear infinite;
}

@keyframes loader{
  to{
    transform:rotate(360deg);
  }
}

/* TOAST */

.toast{
  position:fixed;
  z-index:200;
  left:50%;
  bottom:87px;
  transform:translateX(-50%) translateY(18px);
  opacity:0;
  pointer-events:none;
  background:#e9eaec;
  color:#090a0c;
  padding:9px 13px;
  border-radius:10px;
  font-size:10px;
  font-weight:800;
  transition:.22s;
  white-space:nowrap;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

@media(max-width:380px){
  .cases,
  .grid{
    gap:8px;
  }

  .case{
    min-height:195px;
    padding:12px;
  }

  .hero{
    min-height:205px;
  }

  .heroCar{
    transform:scale(.85);
    transform-origin:right bottom;
    right:-18px;
  }
}
</style>
</head>

<body>

<div class="app">

<header class="header">
  <div class="brand">
    <div class="brandMark">🚘</div>
    <div>
      <div class="brandName">АВТОИМПЕРИЯ</div>
      <div class="brandSub">CAR CASES</div>
    </div>
  </div>

  <div class="balance">
    <div class="balanceLabel">Баланс</div>
    <div class="balanceValue" id="balance">5 000 000 ₽</div>
  </div>
</header>

<main id="content"></main>

</div>

<nav class="nav">

<button class="navBtn active"
        onclick="showPage('cases')"
        id="navCases">
  <div class="navIcon">🎁</div>
  Кейсы
</button>

<button class="navBtn"
        onclick="showPage('garage')"
        id="navGarage">
  <div class="navIcon">🚘</div>
  Гараж
</button>

<button class="navBtn"
        onclick="showPage('market')"
        id="navMarket">
  <div class="navIcon">🛒</div>
  Рынок
</button>

<button class="navBtn"
        onclick="showPage('profile')"
        id="navProfile">
  <div class="navIcon">👤</div>
  Профиль
</button>

</nav>

<div class="modal" id="modal">

  <div class="modalBox">

    <div class="modalHead">
      <div class="modalTitle" id="modalTitle">
        Открытие кейса
      </div>

      <button class="close"
              onclick="closeModal()">
        ×
      </button>
    </div>

    <!-- ПЕРВЫЙ ЭТАП -->

    <div class="casePreview" id="casePreview">

      <div class="previewVisual">
        <div class="previewCar">
          <div class="carBody"></div>
          <div class="carRoof"></div>
          <div class="carWindow"></div>
          <div class="carLight"></div>
          <div class="wheel left"></div>
          <div class="wheel right"></div>
        </div>
      </div>

      <div class="previewDescription"
           id="previewDescription">
      </div>

      <div class="previewPrice"
           id="previewPrice">
      </div>

      <button class="startOpenBtn"
              onclick="startCaseOpening()">
        ОТКРЫТЬ КЕЙС
      </button>

      <button class="cancelOpenBtn"
              onclick="closeModal()">
        ОТМЕНА
      </button>

    </div>

    <!-- ВТОРОЙ ЭТАП -->

    <div class="rouletteArea"
         id="rouletteArea">

      <div class="roulette">

        <div class="marker"></div>

        <div class="rouletteTrack"
             id="rouletteTrack">
        </div>

      </div>

      <div class="spinHint"
           id="spinHint">
        Определяем автомобиль...
      </div>

    </div>

    <!-- РЕЗУЛЬТАТ -->

    <div class="result"
         id="result">

      <div class="resultLabel">
        Твой автомобиль
      </div>

      <div class="resultName"
           id="resultName">
      </div>

      <div class="resultValue"
           id="resultValue">
      </div>

      <div class="resultDiff"
           id="resultDiff">
      </div>

      <div class="resultActions">

        <button class="keepBtn"
                onclick="keepResult()">
          ОСТАВИТЬ

const API_BASE = "";

let serverUser = null;

async function api(path,options={}){

  const headers = {
    "Content-Type":"application/json",
    ...(options.headers || {})
  };

  if(tg?.initData){
    headers["X-Telegram-Init-Data"] = tg.initData;
  }

  const response = await fetch(
    API_BASE + path,
    {
      ...options,
      headers
    }
  );

  const json =
    await response
      .json()
      .catch(()=>({}));

  if(!response.ok){

    throw new Error(
      json.error || "Ошибка сервера"
    );

  }

  return json;

}

let audioContext = null;

function getAudio(){

  if(!audioContext){

    const AudioCtx =
      window.AudioContext ||
      window.webkitAudioContext;

    if(!AudioCtx){
      return null;
    }

    audioContext =
      new AudioCtx();

  }

  if(audioContext.state==="suspended"){

    audioContext.resume()
      .catch(()=>{});

  }

  return audioContext;

}


/*
  Мягкий механический "клац".
  Не квадратная волна.
*/

function rouletteTick(progress=0){

  try{

    const ctx = getAudio();

    if(!ctx)return;

    const now = ctx.currentTime;

    const oscillator =
      ctx.createOscillator();

    const gain =
      ctx.createGain();

    oscillator.type = "triangle";

    const base =
      145 +
      progress * 80;

    oscillator.frequency.setValueAtTime(
      base,
      now
    );

    oscillator.frequency.exponentialRampToValueAtTime(
      base * .68,
      now + .055
    );

    gain.gain.setValueAtTime(
      .0001,
      now
    );

    gain.gain.exponentialRampToValueAtTime(
      .035,
      now + .004
    );

    gain.gain.exponentialRampToValueAtTime(
      .0001,
      now + .065
    );

    oscillator.connect(gain);
    gain.connect(ctx.destination);

    oscillator.start(now);
    oscillator.stop(now + .07);

  }catch(error){}

}


/*
  Более приятный звук победы.
*/

function rouletteWinSound(){

  try{

    const ctx = getAudio();

    if(!ctx)return;

    const now = ctx.currentTime;

    const notes = [
      392,
      494,
      587,
      784
    ];

    notes.forEach(
      (frequency,index)=>{

        const oscillator =
          ctx.createOscillator();

        const gain =
          ctx.createGain();

        const start =
          now + index * .075;

        oscillator.type =
          index === 3
          ? "sine"
          : "triangle";

        oscillator.frequency.setValueAtTime(
          frequency,
          start
        );

        gain.gain.setValueAtTime(
          .0001,
          start
        );

        gain.gain.exponentialRampToValueAtTime(
          index === 3 ? .12 : .075,
          start + .025
        );

        gain.gain.exponentialRampToValueAtTime(
          .0001,
          start + .38
        );

        oscillator.connect(gain);
        gain.connect(ctx.destination);

        oscillator.start(start);
        oscillator.stop(start + .4);

      }
    );

  }catch(error){}

}

      .getElementById("casePreview")
      .classList.add("show");

function buildRoulette(c){

  const track =
    document.getElementById(
      "rouletteTrack"
    );

  track.innerHTML = "";

  /*
    Делаем длинную ленту.
    Победитель будет вставлен
    в заранее определённую позицию.
  */

  const count = 46;

  for(let i=0;i<count;i++){

    const item =
      c.items[
        i % c.items.length
      ];

    const name = item[0];

    const card =
      document.createElement("div");

    card.className =
      "rouletteCard";

    card.innerHTML = `

      <div class="rouletteImage">

        ${carVisual(
          name,
          true
        )}

      </div>

      <div>

        <div class="rouletteName">
          ${escapeHTML(name)}
        </div>

        <div class="roulettePrice">
          ${money(getCar(name).price)}
        </div>

      </div>

    `;

    track.appendChild(card);

  }

  track.style.transition = "none";

  track.style.transform =
    "translateX(0)";

}

    Array.from(

  /*
    Победитель находится далеко
    от начала ленты.
  */

  const winnerIndex = 35;

  if(cards[winnerIndex]){

    cards[winnerIndex].innerHTML = `

      <div class="rouletteImage">

        ${carVisual(
          winner,
          true
        )}

      </div>

      <div>

        <div class="rouletteName">
          ${escapeHTML(winner)}
        </div>

        <div class="roulettePrice">
          ${money(serverValue)}
        </div>

      </div>

    `;

  }


  const roulette =
    document.querySelector(
      ".roulette"
    );

  const center =
    roulette.clientWidth / 2;

  const target =
    -(winnerIndex * cardWidth)
    + center
    - 56;

  const duration = 5200;

  let startTime = null;

  let lastTick = 0;

  function animationFrame(time){

    if(!startTime){

      startTime = time;

    }

    const elapsed =
      time - startTime;

    const progress =
      Math.min(
        elapsed / duration,
        1
      );

    /*
      Частота звуковых кликов
      меняется по скорости рулетки.
    */

    const interval =
      progress < .2
      ? 95
      : progress < .45
      ? 125
      : progress < .7
      ? 165
      : progress < .87
      ? 215
      : 300;

    if(
      time - lastTick >= interval &&
      progress < .97
    ){

      rouletteTick(progress);

      lastTick = time;

    }

    if(progress < 1){

      requestAnimationFrame(
        animationFrame
      );

    }

  }

  requestAnimationFrame(
    animationFrame
  );


  requestAnimationFrame(
    ()=>{

      track.style.transition =
        `transform ${duration}ms cubic-bezier(.08,.72,.14,1)`;

      track.style.transform =
        `translateX(${target}px)`;

    }
  );


  setTimeout(
    ()=>{
      finishCase(
        c,
        winner,
        serverValue
      );
    },
    duration + 160
  );

}


/* =========================================================
   FINISH
========================================================= */

function finishCase(
  c,
  winner,
  serverValue
){

  const car =
    getCar(winner);

  const actualValue =
    Number(serverValue || car.price);

  currentResult = {

    name:winner,

    value:actualValue,

    casePrice:c.price

  };


  const difference =
    actualValue -
    c.price;


  document
    .getElementById("resultName")
    .textContent =
      winner;


  document
    .getElementById("resultValue")
    .textContent =
      money(actualValue);


  const diffElement =
    document.getElementById(
      "resultDiff"
    );


  if(difference > 0){

    diffElement.textContent =
      "+" + money(difference);

    diffElement.className =
      "resultDiff profit";

  }

  else if(difference < 0){

    diffElement.textContent =
      "-" +
      money(
        Math.abs(difference)
      );

    diffElement.className =
      "resultDiff loss";

  }

  else{

    diffElement.textContent =
      "В ноль";

    diffElement.className =
      "resultDiff neutral";

  }


  const sellPrice =
    Math.floor(
      actualValue * .85
    );


  document
    .getElementById("sellInfo")
    .textContent =
      "Мгновенная продажа: " +
      money(sellPrice) +
      " (85% от стоимости)";


  document
    .getElementById("spinHint")
    .textContent =
      "Результат определён";


  document
    .getElementById("result")
    .classList.add("show");


  spinning = false;

  rouletteWinSound();

}


/* =========================================================
   KEEP
========================================================= */

async function keepResult(){

  if(
    !currentResult ||
    !currentCase
  ){

    return;

  }

  try{

    const response =
      await api(
        "/api/cases/keep",
        {
          method:"POST",

          body:JSON.stringify({

            name:
              currentResult.name

          })

        }
      );


    data = response.data;

    saveLocal();

    toast(
      "Автомобиль добавлен в гараж"
    );


    closeModal();

    currentResult = null;

    currentCase = null;

    showPage(currentPage);

  }catch(error){

    toast(
      error.message ||
      "Ошибка сохранения"
    );

  }

}


/* =========================================================
   SELL RESULT
========================================================= */

async function sellResult(){

  if(

  try{

    currentCase = null;

  }catch(error){

    toast(

    );

  }

}


/* =========================================================
   CLOSE
========================================================= */

function closeModal(){

  /*
    Во время рулетки закрыть нельзя.
  */

  if(spinning){

    toast(
      "Дождись окончания рулетки"
    );

    return;

  }


  document
    .getElementById("modal")
    .classList.remove("show");


  document
    .getElementById("casePreview")
    .classList.remove("show");


  document
    .getElementById("rouletteArea")
    .classList.remove("show");


  document
    .getElementById("result")
    .classList.remove("show");


  currentResult = null;

  currentCase = null;

}

/* =========================================================

========================================================= */

async function sellCar(index){

  const car =
    data.garage[index];

  if(!car)return;


  try{

    const response =
      await api(
        "/api/garage/sell",
        {
          method:"POST",

          body:JSON.stringify({
            index
          })

        }
      );


    data =
      response.data;

    saveLocal();

    toast(
      "Продано за " +
      money(response.sellPrice)
    );

    renderGarage();

    updateBalance();

  }catch(error){

    toast(
      error.message ||
      "Ошибка продажи"
    );

  }

}

/* =========================================================
   TOAST
========================================================= */

let toastTimer;

function toast(text){

  const element =
    document.getElementById(
      "toast"
    );

  element.textContent =
    text;

  element.classList.add(
    "show"
  );

  clearTimeout(
    toastTimer
  );

  toastTimer =
    setTimeout(
      ()=>{
        element.classList.remove(
          "show"
        );
      },
      2200
    );

}
